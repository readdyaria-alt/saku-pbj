function search(q){
  setTitle('Cari', true);
  q = (q||'').trim();
  app.innerHTML = `<form class="search" id="ss"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6775" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sq" value="${esc(q)}" placeholder="Ketik kata kunci…" enterkeyhint="search"></form><div id="sr"></div>`;
  const inp = $('#sq'); if(!q) inp.focus();
  const run = () => {
    const v = inp.value.trim().toLowerCase(); const out = $('#sr');
    if (v.length < 2){ out.innerHTML = '<p class="muted">Ketik minimal 2 huruf.</p>'; return; }
    const words = v.split(/\s+/);
    const hits = [];
    Object.entries(BOOKS).forEach(([k,b]) => b.items.forEach((it,i) => {
      const hay = (it.title + ' ' + it.text).toLowerCase();
      if (words.every(w => hay.includes(w))){
        const score = words.reduce((s,w)=>s + (it.title.toLowerCase().includes(w)?5:0) + hay.split(w).length-1, 0);
        const p = hay.indexOf(words[0]); const st = Math.max(0, p-50);
        let snip = it.text.substr(st, 150); snip = esc(snip);
        words.forEach(w => { snip = snip.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); });
        hits.push({k,i,it,score,snip:(st>0?'…':'')+snip+'…'});
      }
    }));
    hits.sort((a,b)=>b.score-a.score);
    out.innerHTML = hits.length ? `<p class="muted" style="margin-bottom:8px">${hits.length} hasil</p>` + hits.map(h=>`<a class="hit" href="#bab/${h.k}/${h.i}"><span class="pill" style="color:${BOOKS[h.k].col}">${BOOKS[h.k].short}</span> <b>${esc(h.it.title)}</b><p>${h.snip}</p></a>`).join('') : '<div class="empty">Tidak ditemukan. Coba kata lain.</div>';
  };
  inp.oninput = run; $('#ss').onsubmit = e => { e.preventDefault(); inp.blur(); };
  if (q) run();
}

const CK_TOTAL = CK.reduce((s,g)=>s+g[1].length,0);
const ckKey = (g,i) => g+'.'+i;
function addWorkdays(date, n){
  const d = new Date(date.getTime()); let step = n >= 0 ? 1 : -1, left = Math.abs(n);
  while (left > 0){ d.setDate(d.getDate()+step); const w = d.getDay(); if (w !== 0 && w !== 6) left--; }
  return d;
}

function cekDetail(id){

  if (p.nilai && p.nilai <= 5e7) notes.push('Nilai ≤ Rp50 jt: Penunjukan Langsung ke DPT lokal / Buyer Purchase dimungkinkan.');

  app.querySelectorAll('.ck').forEach(el => el.onclick = () => { const k = el.dataset.k; p.done[k] = !p.done[k]; store.set('saku.paket', P); const y = scrollY; cekDetail(id); scrollTo(0,y); });

}

        else { head='Wajar (80–100% HPS/OE)'; L.push('Sudah ≤ HPS/OE: negosiasi tidak wajib; bila dilakukan hanya ke penawar terbaik.'); }
      }
      if (hs && vs){ const r2 = vs/hs*100; if (r2 > 110){ L.push('Harga satuan '+r2.toFixed(1).replace('.',',')+'% &gt; 110% HPS → <b>klarifikasi harga timpang</b>. Bila timpang, tambahan volume dibayar dengan harga satuan HPS.'); if(cls==='ok') cls='warn'; } else L.push('Harga satuan '+r2.toFixed(1).replace('.',',')+'% dari HPS: tidak perlu klarifikasi timpang.'); }
      o.innerHTML = (L.length) ? R(cls, head||'Harga satuan', val, L, 'Sumber: TKO III.C.22 (17), III.C.24, III.C.27') : ''; },
    skor(){ const st = +g('st').value, sh = +g('sh').value, bt = +g('bt').value; g('bl').textContent = bt.toFixed(2).replace('.',','); g('bh').textContent = (1-bt).toFixed(2).replace('.',',');
      const na = st*bt + sh*(1-bt);
      o.innerHTML = R(st>=75?'ok':'bad','Nilai akhir', na.toFixed(2).replace('.',','), [st>=75?'Skor teknis memenuhi passing grade (≥ 75).':'<b>Skor teknis &lt; 75: tidak lulus</b>, tidak dihitung nilai akhirnya.','Rumus: skor teknis × bobot teknis + skor harga × bobot harga. Nilai akhir tertinggi = penawaran terbaik.'],'Sumber: TKO III.C.23'); },
    kinerja(){ let tot = 0; app.querySelectorAll('.kq').forEach(el => { tot += (+el.value||0) * (+el.dataset.p); }); const d = g('dir').value;
      let cat, cls, info;
      if (d==='H'){ cat='HITAM'; cls='bad'; info='Dilarang ikut pengadaan 2 tahun + masa percobaan 1 tahun (juga pemilik/pengurus). Fraud lagi di masa percobaan → SKT dicabut selamanya di Pertamina Grup.'; }
      else if (d==='M'){ cat='MERAH'; cls='bad'; info='Dilarang ikut pengadaan 1 tahun sejak sanksi masuk sistem. Kena Merah lagi → Hitam.'; }
      else if (tot >= -30){ cat='HIJAU'; cls='ok'; info='Boleh ikut pemilihan di Pertamina Grup (selain cost recovery).'; }
      else if (tot >= -90){ cat='KUNING'; cls='warn'; info='Boleh ikut pemilihan, tapi tinggal '+(tot+91)+' poin lagi sebelum Merah (< −90).'; }
      else { cat='MERAH'; cls='bad'; info='Poin < −90: dilarang ikut pengadaan 1 tahun sejak sanksi masuk sistem.'; }
      o.innerHTML = R(cls,'Total poin '+(tot>0?'+':'')+tot, cat, [info,'Batas: Hijau ≥ −30 · Kuning −30 > x ≥ −90 · Merah < −90 · Hitam karena jenis pelanggaran.','Hasil resmi tercatat di PVD; kalkulator ini hanya simulasi.'],'Sumber: TKO B-003/B24000/2023-S9 Lampiran 2 & 3'); },
    tenggat(){ const tv = g('t').value, n = parseInt(g('j').value,10); if(!tv){ o.innerHTML=''; return; } const d = addWorkdays(new Date(tv+'T00:00:00'), n);
      o.innerHTML = R('warn', n<0?'Kirim permintaan paling lambat':'Batas akhir', dstr(d), [n<0?'Dihitung 20 hari kerja sebelum tanggal berakhirnya jaminan yang Anda isi.':'Dihitung '+n+' hari kerja setelah tanggal awal (Senin–Jumat).','<b>Libur nasional & cuti bersama belum diperhitungkan</b>; sesuaikan bila ada.'],'Sumber: TKO III.C.13, III.C.29; Pedoman VI.D.5'); }
  };
  if (k==='tenggat'){ const t=g('t'); t.value = new Date().toISOString().slice(0,10); }
  if (k==='kinerja'){ const K = [
    ['Tahap pemilihan',[['Lulus kualifikasi umum & khusus (Tender)',3],['Lulus evaluasi administrasi (Tender)',3],['Lulus evaluasi teknis & HSSE Plan (Tender)',3],['Lulus evaluasi komersial (Tender)',3],['Ditunjuk & tanda tangan kontrak',10],['Tidak kirim dokumen, dengan keterangan tertulis',-10],['Terlambat kirim dokumen kualifikasi/penawaran',-10],['Tidak kirim dokumen, tanpa keterangan tertulis',-20],['Tidak hadir pembukaan penawaran (bila wajib)',-10],['Tidak hadir rapat pemilihan tanpa penjelasan',-15],['Tidak hadir rapat pemilihan dengan penjelasan',-5],['Tidak memberi tanggapan tertulis tepat waktu',-10],['Terlambat hadir negosiasi manual',-5],['Terlambat kirim penegasan penawaran',-10],['Terlambat tanda tangan kontrak',-15],['Sanggahan terbukti tidak benar',-30],['Peserta membatalkan penawaran',-30],['Calon pemenang batal sebelum penunjukan',-30],['Pemenang batal setelah ditunjuk',-60]]],
    ['Tahap pelaksanaan',[['Spesifikasi & delivery time sesuai kontrak',5],['HSSE Plan final ≥ 90%',10],['HSSE Plan final < 90%',-30],['Terlambat, belum denda maksimal',-15],['Terlambat serahkan jaminan',-30],['Terlambat sesuaikan jaminan (perubahan kontrak)',-30],['Terlambat & sudah denda maksimal',-30],['Performance tak sesuai, masih ditolerir FPP',-30],['Kecelakaan: > P3K / tumpahan 1–5 Bbl / rugi USD 10–100 rb',-45],['Tidak menyelesaikan pekerjaan',-60],['Tidak melaksanakan pemeliharaan',-60],['Tidak melaksanakan purna jual',-60],['Kecelakaan: hari kerja hilang / 5–15 Bbl / USD 100 rb–1 jt',-60]]]];
    g('kl').innerHTML = K.map(([grp,items]) => `<div class="grp" style="margin-top:10px"><span>${grp}</span></div><div class="list">` + items.map(([lbl,p]) => `<div class="it" style="gap:10px"><span class="tx" style="font-size:13.5px">${esc(lbl)}</span><b style="color:${p>0?'var(--green)':'var(--red)'};font-size:13px;min-width:30px;text-align:right">${p>0?'+':''}${p}</b><input class="in kq" type="number" min="0" step="1" value="0" data-p="${p}" style="width:58px;padding:6px 8px;text-align:center" inputmode="numeric"></div>`).join('') + '</div>').join('');
    app.querySelectorAll('.kq').forEach(el => el.addEventListener('input', calc.kinerja)); }
  app.querySelectorAll('input,select').forEach(el => el.addEventListener('input', calc[k]));
  app.querySelectorAll('.lvl').forEach(bt => bt.onclick = () => { app.querySelectorAll('.lvl').forEach(x=>x.classList.remove('on')); bt.classList.add('on'); calc[k](); });
  calc[k]();
}

/* ---------- router ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1) || 'home'); const [a,b,c] = h.split('/');
  const tab = {home:'home',pedoman:'pedoman',tko:'tko',buku:(b==='pedoman'?'pedoman':'tko'),bab:(b==='pedoman'?'pedoman':'tko'),cek:'cek',alat:'alat',alur:'home',diagram:'home',tanya:'home',angka:'home',cari:'home'}[a] || 'home';
  document.querySelectorAll('#tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
  if (a==='pedoman') bookList(a);
  else if (a==='tko') tkoHub();
  else if (a==='buku') BOOKS[b] ? bookList(b) : tkoHub();
  else if (a==='bab') chapter(b, +c);
  else if (a==='alur') flow();
  else if (a==='diagram') diagram();
  else if (a==='tanya') chatView();
  else if (a==='angka') angka();
  else if (a==='cari') search(h.slice(5));
  else if (a==='cek') b==='baru' ? cekNew() : b ? cekDetail(b) : cekList();
  else if (a==='alat') b ? tool(b) : toolList();
  else home();
  $('#fab').classList.toggle('off', a==='tanya');
  if (a!=='bab' && a!=='tanya') window.scrollTo(0,0);
}
/* ---------- login Google (dicek ke daftar di Google Sheet) ---------- */
const AUTH_URL = 'https://script.google.com/macros/s/AKfycbwf-k0MzP_zRzFpuNH7amyOEBEYqM9Bk5LNbFiWWPx__i9fYHHb4TkP_dKOE8TUtnx1xA/exec';
const GOOGLE_CLIENT_ID = '597201974898-0rqgearqgkioen7koflcaskgskjl04ei.apps.googleusercontent.com';
const AUTH_KEY = 'saku.auth', AUTH_HOURS = 12;
let authed = false, gsiTries = 0;
function readAuth(){ try { const a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); return a && a.exp > Date.now() ? a : null; } catch { return null; } }
function saveAuth(a){ try { localStorage.setItem(AUTH_KEY, JSON.stringify({ email: a.email, nama: a.nama, exp: Date.now() + AUTH_HOURS * 3600e3 })); } catch {} }
function clearAuth(){ try { localStorage.removeItem(AUTH_KEY); } catch {} }
function startApp(){ authed = true; $('#login').hidden = true; $('#logout').hidden = false; route(); }
function showLogin(msg){ authed = false; $('#login').hidden = false; $('#logout').hidden = true; $('#lmsg').textContent = msg || ''; }
async function onCredential(resp){
  $('#lmsg').textContent = 'Memeriksa akun…';
  try {
    const r = await fetch(AUTH_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ idToken: resp.credential }) });
    const j = await r.json();
    if (j.ok) { saveAuth(j); startApp(); }
    else { clearAuth(); showLogin(j.error || 'Akses ditolak.'); }
  } catch { clearAuth(); showLogin('Tidak bisa terhubung ke server login. Periksa koneksi internet, lalu coba lagi.'); }
}
function initGoogle(){
  if (!(window.google && google.accounts && google.accounts.id)) {
    if (++gsiTries > 40) { $('#lmsg').textContent = 'Layanan login Google tidak bisa dimuat. Periksa koneksi internet.'; return; }
    $('#lmsg').textContent = 'Memuat layanan login Google…'; setTimeout(initGoogle, 500); return;
  }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential });
  google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', width: 280, locale: 'id' });
  $('#lmsg').textContent = '';
}
$('#logout').onclick = () => { clearAuth(); try { google.accounts.id.disableAutoSelect(); } catch {} showLogin('Anda sudah keluar.'); initGoogle(); };
addEventListener('hashchange', () => { if (authed) route(); });
if (readAuth()) startApp();
else { showLogin(); initGoogle(); }

/* ---------- install & offline ---------- */
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; setupInstall(); });
function setupInstall(){
  const card = $('#instCard'); if(!card) return;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone){ card.classList.remove('on'); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (deferred){ card.classList.add('on'); $('#instBtn').style.display=''; $('#instBtn').onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; card.classList.remove('on'); }; }
  else if (ios){ card.classList.add('on'); $('#instBtn').style.display='none'; $('#instTxt').innerHTML = 'Di iPhone: buka di <b>Safari</b>, tekan tombol <b>Bagikan</b> (kotak dengan panah ke atas), lalu pilih <b>Tambahkan ke Layar Utama</b>.'; }
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(()=>{}));
}
