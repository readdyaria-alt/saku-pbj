<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saku PBJ · Pertamina Retail</title>
<meta name="description" content="Buku saku Pedoman & TKO Pemilihan Penyedia Barang/Jasa PT Pertamina Retail, checklist FPP, dan kalkulator pengadaan.">
<meta name="theme-color" content="#0E2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saku PBJ">
<link rel="manifest" href="manifest.webmanifest?v=7">
<link rel="icon" type="image/png" sizes="32x32" href="pam-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="pam-icon-192.png">
<link rel="apple-touch-icon" href="pam-apple-touch-icon.png">
<style>
:root{
  --red:#E31E24;--blue:#005DAA;--green:#6FA832;--navy:#0E2A47;--amber:#E3A008;
  --ink:#1d2733;--muted:#5b6775;--line:#e2e7ee;--soft:#f2f6fa;--softr:#fdeeee;--softg:#eef6e6;
  --bg:#f5f7fa;--card:#fff;--c:var(--blue);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:calc(68px + var(--safe-b));-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
/* app bar */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.bar .back{width:34px;height:34px;border-radius:10px;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:0;cursor:pointer}
.bar .back.on{display:flex}
.bar h1{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sbtn{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tri{display:flex;height:4px}.tri i{flex:1}.tri i:nth-child(1){background:var(--green)}.tri i:nth-child(2){background:var(--blue)}.tri i:nth-child(3){background:var(--red)}
main{max-width:720px;margin:0 auto;padding:16px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted);font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--blue)}
/* generic */
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(14,42,71,.06);margin-bottom:12px}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px}
.hero .lg{background:#fff;border-radius:10px;padding:8px 10px;display:inline-block;margin-bottom:12px}
.hero .lg img{height:28px;display:block}
.hero h2{font-size:22px;line-height:1.15;margin-bottom:6px}
.hero h2 em{font-style:normal;color:#9bd65a}
.hero p{font-size:13px;opacity:.85}
.hero .sq{position:absolute;border-radius:6px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(14,42,71,.06);border-left:4px solid var(--tc,var(--blue))}
.tile b{display:block;font-size:14px;color:var(--navy)}
.tile span{font-size:12px;color:var(--muted)}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.list{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(14,42,71,.06)}
.list a,.list .it{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.list a:last-child,.list .it:last-child{border-bottom:0}
.list .num{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--lc,var(--blue));font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.list .tx{flex:1;min-width:0}
.list .tx b{display:block;font-size:14.5px;color:var(--navy);font-weight:650}
.list .tx span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#a7b1bd;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:var(--soft);color:var(--navy)}
.btn.red{background:var(--softr);color:var(--red)}
.btn.full{width:100%}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--blue)}
/* chapter content (diambil dari buku saku) */
.chap .kick{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.chap h2.t{font-size:22px;line-height:1.2;color:var(--navy);margin-bottom:6px}
.chap .ref{margin-bottom:12px}
.ct h2{font-size:16px;font-weight:800;color:var(--navy);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.ct h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--c,var(--blue))}
.ct p{margin:6px 0}
.ct .lead{color:var(--muted);font-size:14px;margin-bottom:8px}
.ct ul{list-style:none}
.ct ul.d li{position:relative;padding-left:16px;margin-bottom:6px}
.ct ul.d li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--c,var(--blue))}
.ct ol.n{list-style:none;counter-reset:n}
.ct ol.n li{counter-increment:n;position:relative;padding-left:30px;margin-bottom:8px}
.ct ol.n li::before{content:counter(n);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--c,var(--blue));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ct b,.ct strong{color:var(--navy)}
.ct .key{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.ct .key b{color:#ffd54a}
.ct .box{border-radius:12px;padding:12px 14px;margin:10px 0}
.ct .box.s{background:var(--soft)}.ct .box.r{background:var(--softr)}.ct .box.g{background:var(--softg)}.ct .box.o{border:1px solid var(--line)}
.ct .grid2,.ct .grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ct .grid3{grid-template-columns:1fr 1fr 1fr}
.ct .grid2>.box,.ct .grid3>.box{margin:0}
.ct .chip{background:var(--soft);border-radius:10px;padding:10px}
.ct .chip b{display:block;font-size:14px}
.ct .chip span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.ct .tw{overflow-x:auto;margin:8px 0;border-radius:10px;border:1px solid var(--line)}
.ct table{width:100%;border-collapse:collapse;font-size:13px;min-width:100%}
.ct th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:12.5px;font-weight:700}
.ct td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;background:#fff}
.ct tr:nth-child(even) td{background:#f8fafc}
.ct .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;background:var(--blue)}
.ct .tag.r{background:var(--red)}.ct .tag.g{background:var(--green)}.ct .tag.n{background:var(--navy)}
.ct .big{font-size:24px;font-weight:800;color:var(--red);line-height:1;white-space:nowrap}
.ct .small{font-size:12.5px;color:var(--muted)}
.ct .term{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ct .term b{color:var(--blue)}
.ct .who{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--blue);margin-left:4px;vertical-align:1px}
.ct .flow .st,.flowx .st{display:grid;grid-template-columns:30px 1fr;gap:10px;position:relative;padding-bottom:14px}
.ct .flow .st:not(:last-child)::after{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.ct .dot{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.ct .st .t b{display:block;font-size:14.5px}
.ct .st .t span{display:block;font-size:13px;color:var(--muted)}
.ct .st .t span.who{display:inline-block;font-size:11px;color:var(--blue)}
.ct .st .t span b{display:inline;font-size:inherit}
.ct .mx{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.ct .mx div{height:26px;border-radius:5px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.ct .l1{background:#7DB73D}.ct .l2{background:#c4c93a}.ct .l3{background:#f2a33a}.ct .l4{background:#ec6b2d}.ct .l5{background:#E31E24}
.ct .num{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.navpn{display:flex;gap:8px;margin-top:16px}
.navpn a{flex:1;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(14,42,71,.06);font-size:12px;color:var(--muted)}
.navpn a b{display:block;color:var(--navy);font-size:13.5px}
.navpn a.nx{text-align:right}
/* flowchart */
.fcw .lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-bottom:10px}
.fcw .lg span{display:flex;align-items:center;gap:5px}
.fcw .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.fcw .lg i.dm{border:1.5px dashed var(--red);transform:rotate(45deg);background:#fff;width:9px;height:9px}
.fcw .cols{display:flex;flex-direction:column;gap:14px}
.fcw .col{display:flex;flex-direction:column;gap:14px}
.fcw .bx{position:relative;background:#fff;border-radius:10px;padding:10px 12px 10px 46px;font-size:13px;color:var(--muted);border-left:6px solid var(--c2);box-shadow:0 1px 2px rgba(14,42,71,.07)}
.fcw .bx b{display:block;font-size:14.5px;color:var(--navy)}
.fcw .bx em{font-style:normal;position:absolute;left:10px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fcw .bx.g{--c2:var(--green)}.fcw .bx.b{--c2:var(--blue)}.fcw .bx.y{--c2:var(--amber)}.fcw .bx.n{--c2:var(--navy)}
.fcw .bx.bg{--c2:var(--blue);box-shadow:inset 5px 0 0 var(--green),0 1px 2px rgba(14,42,71,.07)}
.fcw .bx.bn{--c2:var(--navy);box-shadow:inset 5px 0 0 var(--blue),0 1px 2px rgba(14,42,71,.07)}
.fcw .col>*:not(:last-child)::after,.fcw .col:first-child>*:last-child::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #9aa6b4}
.fcw .dc{position:relative;text-align:center;border:2px dashed var(--red);background:#fff5f5;border-radius:16px;padding:8px;font-weight:700;color:var(--navy);font-size:14px}
.fcw .dc.n{border-color:var(--navy);background:#f1f4f8}
.fcw .dc small{display:block;font-weight:500;color:var(--red);font-size:12.5px}
.fcw .dc.n small{color:var(--navy)}
.fcw .cont{display:none}
/* search results */
.hit{display:block;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(14,42,71,.06)}
.hit b{color:var(--navy)}
.hit p{font-size:13px;color:var(--muted);margin-top:3px}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
/* forms */
label.f{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 5px}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px;outline:0}
.in:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{margin-top:14px;border-radius:12px;padding:14px;background:var(--soft)}
.res .v{font-size:24px;font-weight:800;color:var(--navy);line-height:1.15}
.res .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.res.ok{background:var(--softg)}.res.warn{background:#fff6e0}.res.bad{background:var(--softr)}
.res ul{list-style:none;margin-top:6px}
.res li{position:relative;padding-left:16px;margin-bottom:5px;font-size:14px}
.res li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--navy)}
.src{font-size:11.5px;color:var(--muted);margin-top:10px}
input[type=range]{width:100%}
/* checklist */
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:99px}
.grp{font-size:13px;font-weight:800;color:var(--navy);margin:16px 2px 6px;display:flex;justify-content:space-between}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.ck:last-child{border-bottom:0}
.ck .bxk{width:22px;height:22px;border-radius:7px;border:2px solid #b7c1cd;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.ck.on .bxk{background:var(--green);border-color:var(--green)}
.ck.on .bxk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck .ctx{flex:1;font-size:14px}
.ck.on .ctx{color:var(--muted);text-decoration:line-through}
.ck .ctx small{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.ck .who2{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--blue);margin-left:4px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.inst{display:none}
.inst.on{display:block}
.angka{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.angka div{background:#fff;border-radius:12px;padding:12px;border-left:4px solid var(--ac,var(--blue));box-shadow:0 1px 2px rgba(14,42,71,.06)}
.angka b{display:block;font-size:17px;color:var(--navy);line-height:1.2}
.angka span{font-size:12px;color:var(--muted)}

.lvls{display:flex;flex-direction:column;gap:8px}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);border-left:6px solid var(--lc);border-radius:10px;background:#fff;padding:11px 12px;cursor:pointer}
.lvl b{font-size:14.5px;color:var(--navy)}
.lvl span{font-size:13px;color:var(--muted);font-weight:700}
.lvl.on{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,#fff);box-shadow:0 0 0 1px var(--lc)}
.dg h3{display:flex;gap:8px;align-items:baseline;font-size:18px;color:var(--navy);margin:22px 2px 10px}
.dg h3 small{font-size:12px;font-weight:800;color:var(--hc,var(--red))}
.dg .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 2px 10px}
.dg .legend span{display:flex;align-items:center;gap:6px}
.dg .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tl{background:#fff;border-radius:14px;padding:14px 14px 2px;box-shadow:0 1px 2px rgba(14,42,71,.06)}
.tl .s{display:grid;grid-template-columns:32px 1fr;gap:12px}
.tl .s .rail{display:flex;flex-direction:column;align-items:center}
.tl .s .rail b{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sc);background:var(--sb);color:var(--sc);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tl .s .rail i{flex:1;width:2px;min-height:10px;background:linear-gradient(180deg,var(--sc),var(--nc))}
.tl .s:last-child .rail i{opacity:0}
.tl .s .bd{padding:4px 0 14px}
.tl .s .bd .w{display:block;font-size:11.5px;font-weight:800;color:var(--sc)}
.tl .s .bd .tt{display:block;font-size:14.5px;font-weight:700;color:var(--navy)}
.tl .s .bd .d{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.mflow{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.mflow .mb{border:1.5px solid var(--mc);background:color-mix(in srgb,var(--mc) 10%,#fff);border-radius:10px;padding:10px 12px;font-size:14px}
.mflow .ar{font-size:12px;color:var(--muted);padding-left:12px}
.mgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{background:#fff;border-radius:12px;padding:14px;border-top:4px solid var(--mc);box-shadow:0 1px 2px rgba(14,42,71,.06)}
.mcard>b{display:block;font-size:15.5px;color:var(--navy)}
.mcard>small{display:block;font-size:12px;font-weight:700;color:var(--mc);margin-bottom:6px}
.mcard .sub{margin-top:8px}
.mcard .sub b{display:block;font-size:13.5px;color:var(--mc)}
.mcard .sub span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.mcard ul{list-style:none;margin-top:4px}
.mcard li{font-size:13px;color:var(--ink);line-height:1.45;margin-bottom:4px;padding-left:12px;position:relative}
.mcard li::before{content:"·";position:absolute;left:2px;font-weight:800}
.ph{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(14,42,71,.06);margin-bottom:10px}
.ph .phh{padding:10px 14px;background:var(--pb);display:flex;gap:10px;align-items:baseline}
.ph .phh b{color:var(--pc);font-size:13px}
.ph .phh span{font-weight:700;color:var(--navy);font-size:14.5px}
.ph .tl{box-shadow:none;border-radius:0}

.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{display:flex}
.msg>div{max-width:88%;border-radius:16px;padding:10px 13px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 2px rgba(14,42,71,.07)}
.msg.u{justify-content:flex-end}
.msg.u>div{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg.b>div{background:#fff;border-bottom-left-radius:5px}
.cans{font-size:14.5px;color:var(--ink)}
.cnote{font-size:12px;color:var(--muted);margin-top:6px}
.csrc{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.crel{margin-top:10px;font-size:13px;color:var(--muted)}
.crel>b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.crel .ci{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:6px;color:var(--ink)}
.crel .ci .csrc{border:0;padding-top:2px;margin-top:4px}
.ctool{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;background:var(--softg);color:var(--navy);padding:6px 10px;border-radius:9px}
.cai{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;color:#7a4dd8;background:#f1ebff;border-radius:6px;padding:2px 7px;margin-bottom:6px}
.cmd p{margin:0 0 6px}.cmd ul{margin:2px 0 6px 0;padding-left:18px}.cmd li{margin-bottom:3px}

<script>window.CONTENT={"pedoman": [{"book": "pedoman", "sec": "01 · Dasar", "ref": "Bab I–II", "kick": "Kenapa ada aturan ini", "title": "Tujuan & kebijakan", "c": "--c:var(--blue)", "html": "<p class=\"lead\">Pedoman menyamakan pola pikir pelaku pengadaan, dari perencanaan, pemilihan penyedia, pengawasan dan closing kontrak, sampai penilaian kinerja penyedia. Berlaku untuk semua pengadaan yang dibiayai anggaran Pertamina Retail.</p>\n  <h2>Kebijakan umum</h2>\n  <ul class=\"d\">\n    <li>Dapatkan barang/jasa secara <b>efektif dan efisien</b>, sesuai ketentuan.</li>\n    <li><b>Utamakan Sinergi</b>: Anak Perusahaan &amp; Afiliasi Pertamina, lalu BUMN dan grupnya.</li>\n    <li><b>Utamakan produk dalam negeri</b> selama kualitas, waktu, dan harga bisa dipertanggungjawabkan.</li>\n    <li>Dorong <b>konsolidasi</b> kebutuhan: sentralisasi dan <i>joint procurement</i> di Pertamina Grup.</li>\n    <li>Percepat proses &amp; keputusan, pakai <b>teknologi informasi</b>.</li>\n  </ul>\n  <h2>9 prinsip dasar (wajib)</h2>\n  <div class=\"grid3\">\n    <div class=\"chip\"><b>Adil</b><span>Perlakuan sama bagi semua penyedia</span></div>\n    <div class=\"chip\"><b>Akuntabel</b><span>Tercapai &amp; bisa dipertanggungjawabkan</span></div>\n    <div class=\"chip\"><b>Efektif</b><span>Sesuai kebutuhan, manfaat maksimal</span></div>\n    <div class=\"chip\"><b>Efisien</b><span>Hasil optimal, bukan sekadar harga terendah</span></div>\n    <div class=\"chip\"><b>Integritas</b><span>Patuh penuh pada etika</span></div>\n    <div class=\"chip\"><b>Kehati-hatian</b><span>Antisipasi kerugian</span></div>\n    <div class=\"chip\"><b>Kemandirian</b><span>Bebas tekanan &amp; benturan kepentingan</span></div>\n    <div class=\"chip\"><b>Kompetitif</b><span>Persaingan sehat</span></div>\n    <div class=\"chip\"><b>Transparan</b><span>Syarat &amp; tata cara terbuka</span></div>\n  </div>"}, {"book": "pedoman", "sec": "01 · Dasar", "ref": "Bab II.C", "kick": "Pegangan sikap", "title": "Etika pengadaan", "c": "--c:var(--red)", "html": "<p class=\"lead\">Berlaku untuk <b>semua pihak</b> yang terlibat, termasuk FPP.</p>\n  <ul class=\"d\">\n    <li>Kerja tertib, profesional, mandiri, dan <b>jaga kerahasiaan</b> informasi.</li>\n    <li>Jangan saling memengaruhi sampai menimbulkan persaingan tidak sehat.</li>\n    <li>Cegah pemborosan dan kebocoran keuangan perusahaan.</li>\n    <li><b>Tidak menerima, menawarkan, atau menjanjikan</b> hadiah, imbalan, komisi, atau rabat yang berkaitan dengan pengadaan.</li>\n    <li>Cegah penyalahgunaan wewenang dan kolusi.</li>\n  </ul>\n  <h2>Contoh benturan kepentingan</h2>\n  <div class=\"box r\">\n    <ul class=\"d\">\n      <li>Pekerja FPP/Pejabat Berwenang FPP/Procurement/Tim Registrasi <b>mengendalikan badan usaha</b> yang ikut pemilihan penyedia.</li>\n      <li>Direksi/komisaris/personel inti satu perusahaan merangkap di perusahaan lain yang ikut tender yang sama.</li>\n      <li>Pengurus koperasi merangkap pekerja yang terlibat langsung dalam pengadaan yang melibatkan koperasi itu.</li>\n      <li>Konsultan perencana/pengawas konstruksi jadi pelaksana pekerjaan yang ia rencanakan/awasi (kecuali konstruksi terintegrasi).</li>\n      <li>Beberapa peserta tender dikendalikan pihak yang sama atau &gt;50% sahamnya dimiliki pemegang saham yang sama.</li>\n    </ul>\n  </div>\n  <div class=\"key\"><b>Ingat:</b> Pejabat Berwenang FPP tidak boleh merangkap anggota Tim Registrasi atau pekerja Fungsi Procurement (kecuali pengadaan material stock). Semua pelaku menandatangani <b>Pakta Integritas</b>.</div>"}, {"book": "pedoman", "sec": "01 · Dasar", "ref": "Bab I.C", "kick": "Kamus singkat", "title": "Istilah yang sering muncul", "c": "--c:var(--blue)", "html": "<div class=\"term\"><b>FPP</b><span>Fungsi Peminta Pengadaan: merencanakan kebutuhan, meminta, mengawasi kontrak, dan menerima hasil.</span></div>\n  <div class=\"term\"><b>PPL</b><span><i>Procurement Plan List</i>: daftar rencana kebutuhan yang dibuat FPP dan dikirim ke Procurement.</span></div>\n  <div class=\"term\"><b>DP3</b><span>Dokumen Pendukung Pelaksanaan Pemilihan, disiapkan FPP untuk Procurement.</span></div>\n  <div class=\"term\"><b>HPS/OE</b><span>Harga Perkiraan Sendiri: disusun FPP, disetujui Pejabat Berwenang FPP, dipakai menilai kewajaran harga.</span></div>\n  <div class=\"term\"><b>Lingkup Kerja</b><span>Bagian rancangan kontrak: spesifikasi, uraian pekerjaan, volume, waktu, metode, tenaga kerja.</span></div>\n  <div class=\"term\"><b>LHP</b><span>Laporan Hasil Pemilihan dari Procurement ke Pejabat Berwenang FPP untuk disetujui.</span></div>\n  <div class=\"term\"><b>DPT / SKT</b><span>Daftar Penyedia Teregistrasi; penyedia yang lulus registrasi mendapat Surat Keterangan Teregistrasi.</span></div>\n  <div class=\"term\"><b>PJ Kontrak</b><span>Penanggung Jawab Kontrak: Pejabat Berwenang FPP atau pejabat FPP yang diberi wewenang mengawasi kontrak.</span></div>\n  <div class=\"term\"><b>Sole Source</b><span>Satu-satunya sumber penyedia (pabrikan, agen tunggal, distributor tunggal).</span></div>\n  <div class=\"term\"><b>OA</b><span><i>Outline Agreement</i>/Kontrak Payung, hasil pengadaan sentralisasi.</span></div>\n  <div class=\"term\"><b>Keadaan Darurat</b><span>Kondisi yang bila tak segera ditangani menimbulkan kerugian lebih besar, mengganggu operasi, atau membahayakan jiwa/lingkungan.</span></div>\n  <div class=\"term\" style=\"border:none\"><b>Force Majeure</b><span>Keadaan kahar di luar kehendak para pihak, mis. bencana, pemogokan, kebakaran.</span></div>"}, {"book": "pedoman", "sec": "02 · Pelaku", "ref": "Bab III", "kick": "Peta peran", "title": "Siapa melakukan apa", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:108px\">Pelaku</th><th>Peran utama</th></tr>\n    <tr><td><b>FPP</b></td><td>Rencana kebutuhan (PPL), DP3, HPS/OE, evaluasi teknis, pengawasan kontrak, penerimaan jasa</td></tr>\n    <tr><td><b>Pejabat Berwenang FPP</b></td><td>Menetapkan PPL &amp; DP3, menyetujui LHP, menandatangani kontrak &amp; amandemen</td></tr>\n    <tr><td><b>Fungsi Procurement</b></td><td>Konsolidasi PPL, pemilihan penyedia, LHP, penerbitan kontrak, penerimaan barang (BASTB &amp; GR)</td></tr>\n    <tr><td><b>Tim Registrasi</b></td><td>Registrasi &amp; kualifikasi umum penyedia, terbitkan/bekukan/cabut SKT</td></tr>\n    <tr><td><b>Fungsi Hukum</b></td><td>Template <i>general terms &amp; conditions</i>, review aspek hukum</td></tr>\n    <tr><td><b>Fungsi Keuangan</b></td><td>Pajak, asuransi, syarat bank garansi &amp; pembayaran; verifikasi &amp; simpan jaminan</td></tr>\n    <tr><td><b>Fungsi HSSE</b></td><td>Syarat CSMS, kriteria &amp; penilaian HSSE Plan</td></tr>\n    <tr><td><b>Manajemen Risiko</b></td><td>Masukan <i>risk assessment</i> &amp; kebutuhan jaminan pelaksanaan</td></tr>\n    <tr><td><b>Procurement Committee</b></td><td>Review permintaan di luar PPL ≥ Rp5 M dan pengecualian STK (ijin prinsip)</td></tr>\n    <tr><td><b>Komite Sanksi</b></td><td>Menentukan sanksi khusus (mis. indikasi fraud) &amp; koreksi sanksi</td></tr>\n  </table>\n  <div class=\"box g\"><b>Tenaga Ahli Eksternal</b> boleh membantu (mis. menyusun DP3, evaluasi), tapi hasilnya <b>tetap di-review</b> fungsi pengguna dan pada prinsipnya ia tidak menandatangani dokumen pengadaan.</div>"}, {"book": "pedoman", "sec": "02 · Tugas FPP", "ref": "Bab III.A", "kick": "Checklist FPP", "title": "Perencanaan & pemilihan", "c": "--c:var(--green)", "html": "<h2>Tahap perencanaan</h2>\n  <ul class=\"d\">\n    <li>Susun rencana kerja, identifikasi kebutuhan (rutin/non-rutin) dan sumber anggaran (operasional/investasi).</li>\n    <li>Susun <b>RKA</b> dan tuangkan kebutuhan ke <b>PPL</b>; usulkan kebutuhan di luar PPL bila ada.</li>\n    <li>Usulkan <b>metode pemenuhan</b>: Sinergi, Tender, atau Swakelola.</li>\n    <li>Siapkan <b>DP3</b> dan <b>memorandum permintaan</b> pemilihan penyedia ke Procurement.</li>\n    <li>Kaji pemakaian produk/kompetensi Anak Perusahaan &amp; Afiliasi Pertamina, tuangkan dalam Lingkup Kerja.</li>\n    <li>Usulkan barang/jasa yang perlu masuk <b>Sistem Catalog</b>.</li>\n  </ul>\n  <h2>Tahap pemilihan penyedia</h2>\n  <ul class=\"d\">\n    <li>Jadi anggota Tim Registrasi/Tim Tender bila ditunjuk.</li>\n    <li>Beri penjelasan di <b>pre-bid meeting</b>; susun rancangan kontrak bersama Procurement.</li>\n    <li>Lakukan <b>kualifikasi khusus</b>, evaluasi administrasi, <b>teknis</b>, <b>HSSE Plan</b>, serta evaluasi komersial &amp; negosiasi bersama Procurement.</li>\n    <li>Laporkan progres berkala ke Pejabat Berwenang; siapkan jawaban sanggahan bersama Procurement.</li>\n    <li><b>Review LHP</b> sebelum diajukan; review dan paraf kontrak sebelum ditandatangani.</li>\n    <li>Bila pemilihan ulang gagal: usulkan metode berikutnya (PL/Tender Terbatas/Tender Terbuka).</li>\n  </ul>"}, {"book": "pedoman", "sec": "02 · Tugas FPP", "ref": "Bab III.A–B", "kick": "Checklist FPP", "title": "Saat kontrak berjalan", "c": "--c:var(--green)", "html": "<p class=\"lead\">FPP biasanya bertindak sebagai <b>Penanggung Jawab Kontrak</b> (bila diberi wewenang oleh Pejabat Berwenang).</p>\n  <ol class=\"n\" style=\"--c:var(--green)\">\n    <li><b>Awasi</b> pelaksanaan kontrak dan laporkan berkala ke Pejabat Berwenang.</li>\n    <li>Usulkan <b>penundaan, pemutusan, atau perubahan</b> kontrak bila ada justifikasi.</li>\n    <li><b>Negosiasi</b> perubahan kontrak dan laporkan hasilnya.</li>\n    <li>Review dan paraf <b>amandemen kontrak</b> sebelum ditandatangani.</li>\n    <li>Lakukan <b>penerimaan jasa</b> (dan barang dalam kontrak jasa).</li>\n    <li>Lakukan <b>penilaian kinerja</b> pelaksana kontrak.</li>\n    <li>Lakukan <b>penutupan kontrak</b> (<i>close-out</i>).</li>\n    <li>Kelola barang/jasa yang diterima, atau serahkan ke pengguna akhir (khusus proyek).</li>\n  </ol>\n  <h2 style=\"--c:var(--navy)\">Peran Pejabat Berwenang FPP</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Menetapkan PPL, DP3, dan usulan metode; menyetujui/menolak LHP.</li>\n    <li>Menandatangani kontrak dan amandemen.</li>\n    <li>Menyetujui penundaan, perubahan, hasil penerimaan, pemutusan, dan close-out.</li>\n  </ul>\n  <div class=\"key\"><b>Barang:</b> penerimaan dan GR dibuat Fungsi Procurement (BASTB ditandatangani bersama FPP &amp; pelaksana kontrak untuk material non-stock). <b>Jasa:</b> diterima oleh FPP.</div>"}, {"book": "pedoman", "sec": "03 · Alur", "ref": "Bab III–VIII", "kick": "Gambaran besar", "title": "Alur pengadaan", "c": "--c:var(--blue)", "html": "<div class=\"flow\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">1</div><div class=\"t\"><b>Rencanakan kebutuhan <span class=\"who\">FPP</span></b><span>RKA &amp; PPL ditetapkan Pejabat Berwenang FPP, lalu dikonsolidasi Procurement.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">2</div><div class=\"t\"><b>Siapkan permintaan <span class=\"who\">FPP</span></b><span>DP3, HPS/OE, Lingkup Kerja, usulan metode, memo permintaan.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">3</div><div class=\"t\"><b>Pilih penyedia <span class=\"who\">Procurement + FPP</span></b><span>Registrasi/kualifikasi, pre-bid, evaluasi, negosiasi, sanggahan.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">4</div><div class=\"t\"><b>Setujui hasil <span class=\"who\">Pejabat Berwenang</span></b><span>LHP direview FPP, lalu disetujui Pejabat Berwenang FPP.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">5</div><div class=\"t\"><b>Terbitkan kontrak <span class=\"who\">Procurement</span></b><span>Jaminan pelaksanaan masuk sebelum tanda tangan kontrak/SP3MK.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">6</div><div class=\"t\"><b>Awasi pekerjaan <span class=\"who\">PJ Kontrak</span></b><span>Kendalikan lingkup, biaya, waktu, HSSE Plan, perubahan &amp; denda.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--navy)\">7</div><div class=\"t\"><b>Terima hasil <span class=\"who\">FPP / Procurement</span></b><span>Jasa oleh FPP; barang oleh Procurement (BASTB &amp; GR).</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--navy)\">8</div><div class=\"t\"><b>Nilai &amp; tutup kontrak <span class=\"who\">PJ Kontrak</span></b><span>Penilaian kinerja, pembayaran terakhir, pengembalian jaminan.</span></div></div>\n  </div>"}, {"book": "pedoman", "sec": "04 · Metode", "ref": "Bab V.A", "kick": "Pilih jalurnya", "title": "Metode pemenuhan kebutuhan", "c": "--c:var(--red)", "html": "<table>\n    <tr><th style=\"width:68px\">Metode</th><th>Mekanisme</th><th style=\"width:80px\">Pelaksana</th></tr>\n    <tr><td rowspan=\"2\"><b>Sinergi Pertamina Inc.</b></td><td>Penunjukan Anak Perusahaan/Afiliasi Pertamina</td><td>Procurement</td></tr>\n    <tr><td>Penugasan Anak Perusahaan/Afiliasi Pertamina</td><td>FPP</td></tr>\n    <tr><td rowspan=\"2\"><b>Tender</b></td><td>Tender Terbatas</td><td>Procurement</td></tr>\n    <tr><td>Tender Terbuka</td><td>Procurement</td></tr>\n    <tr><td rowspan=\"4\"><b>Non-Tender</b></td><td>Penunjukan Langsung</td><td>Procurement</td></tr>\n    <tr><td>e-Purchasing (e-Catalog / OA Catalog)</td><td>Procurement / FPP*</td></tr>\n    <tr><td>Buyer Purchase</td><td>Procurement</td></tr>\n    <tr><td>User Purchase</td><td>FPP</td></tr>\n    <tr><td rowspan=\"2\"><b>Swakelola</b></td><td>Dilaksanakan sendiri</td><td>FPP</td></tr>\n    <tr><td>Dilaksanakan pihak lain</td><td>FPP</td></tr>\n  </table>\n  <p class=\"small\">* e-Purchasing oleh FPP bila FPP sudah bisa bertransaksi di Sistem Catalog.</p>\n  <div class=\"key\"><b>Urutan berpikir:</b> utamakan <b>Sinergi Pertamina Incorporated</b>. Kalau tidak bisa, strategi dan metode ditentukan <b>Procurement bersama FPP</b>.</div>"}, {"book": "pedoman", "sec": "04 · Metode", "ref": "Bab V.B–C", "kick": "Jalur utama", "title": "Sinergi & Tender", "c": "--c:var(--red)", "html": "<h2>Penunjukan (Sinergi)</h2>\n  <ul class=\"d\">\n    <li>Barang/jasa harus <b>produk atau layanan</b> Anak Perusahaan/Afiliasi itu, dan bidang usahanya sesuai.</li>\n    <li>Lebih dari satu yang mampu? Tunjuk salah satu dengan <b>justifikasi FPP</b>, disetujui Pejabat Berwenang FPP.</li>\n  </ul>\n  <h2>Penugasan (Sinergi)</h2>\n  <ul class=\"d\">\n    <li>Atas kebutuhan FPP atau instruksi Direksi.</li>\n    <li>Wajib ada <b>kajian teknis &amp; keekonomian</b>, disetujui Direktur terkait.</li>\n    <li>Boleh mengecualikan kesesuaian bidang/golongan usaha. Jenis kontrak pada dasarnya <i>cost plus fee</i>.</li>\n  </ul>\n  <h2>Tender Terbatas</h2>\n  <ul class=\"d\">\n    <li>Dipakai bila kebutuhan tak bisa dipenuhi lewat Sinergi.</li>\n    <li>Diikuti penyedia dalam <b>DPT</b> yang memenuhi kualifikasi umum.</li>\n    <li>Barang spesifik dengan &gt;1 penyedia yang ditunjuk prinsipal → tender terbatas di antara mereka.</li>\n  </ul>\n  <h2>Tender Terbuka</h2>\n  <div class=\"grid2\">\n    <div class=\"box r\"><span class=\"big\">≥ Rp100 M</span><br>Pekerjaan konstruksi / konstruksi terintegrasi</div>\n    <div class=\"box r\"><span class=\"big\">≥ Rp50 M</span><br>Tender terbatas sudah <b>1× gagal</b></div>\n  </div>\n  <p class=\"small\">Terbuka untuk penyedia DPT maupun non-DPT (non-DPT wajib lulus kualifikasi umum dulu).</p>"}, {"book": "pedoman", "sec": "04 · Non-Tender", "ref": "Bab V.D.1", "kick": "Tanpa tender", "title": "Penunjukan Langsung", "c": "--c:var(--red)", "html": "<div class=\"box r\" style=\"display:flex;gap:9.6px;align-items:center\"><span class=\"big\">≤ Rp50 jt</span><span>Mengundang DPT yang memenuhi kualifikasi umum dan <b>berdomisili di sekitar lokasi</b> pekerjaan.</span></div>\n  <p style=\"margin:6.4px 0 4px\">Di atas itu, PL boleh untuk kondisi berikut, <b>dengan justifikasi FPP dan persetujuan Pejabat Berwenang FPP</b>:</p>\n  <ol class=\"n\" style=\"--c:var(--red)\">\n    <li>BUMN/anak/afiliasi BUMN untuk produk/layanan utamanya (&gt;1 yang mampu → tender terbatas antar mereka).</li>\n    <li>Pemegang paten/HAKI, garansi OEM, atau standardisasi merek.</li>\n    <li>Bersifat <i>knowledge intensive</i> / perlu alih teknologi.</li>\n    <li>Barang/jasa spesifik <b>sole source</b>.</li>\n    <li>Penanganan <b>keadaan darurat</b>.</li>\n    <li>Jasa konsultan perorangan.</li>\n    <li>Uji coba (litbang).</li>\n    <li>Pekerjaan lanjutan yang secara teknis satu kesatuan.</li>\n    <li><b>Repeat order</b> (lihat halaman berikut).</li>\n    <li>Memanfaatkan kontrak berjalan (amandemen tambah pihak / kontrak turunan).</li>\n    <li>Konsultan &amp; pekerjaan konstruksi dalam kondisi tertentu (darurat, kompleks, rahasia, skala kecil, lanjutan, penugasan pemerintah).</li>\n  </ol>"}, {"book": "pedoman", "sec": "04 · Non-Tender", "ref": "Bab V.D.1.2)i–j", "kick": "Syarat ketat", "title": "Repeat order", "c": "--c:var(--red)", "html": "<p class=\"lead\">Semua syarat ini harus terpenuhi sekaligus:</p>\n  <ul class=\"d\">\n    <li><b>Bukan</b> dibiayai anggaran investasi.</li>\n    <li>Kinerja pelaksana kontrak sebelumnya <b>baik</b>.</li>\n    <li>Spesifikasi <b>sama</b> (atau setara/lebih baik, disetujui Pejabat Berwenang FPP).</li>\n    <li>Volume <b>tidak melebihi</b> pengadaan sebelumnya.</li>\n    <li>Bukan pekerjaan <i>multiyears</i>, dan kontrak tidak mengatur <i>price adjustment</i>.</li>\n    <li>Kontrak asal diproses lewat Penunjukan Sinergi, Tender Terbuka, atau Tender Terbatas.</li>\n    <li>Maksimal <b>1 kali</b>, dengan membuat kontrak baru.</li>\n    <li>Wajib ada <b>HPS/OE</b>; kenaikan maksimal <b>10%</b> dari harga kontrak sebelumnya.</li>\n  </ul>\n  <h2>Memanfaatkan kontrak yang sedang berjalan</h2>\n  <ul class=\"d\">\n    <li>Lewat amandemen menambah para pihak, atau kontrak turunan.</li>\n    <li>Pelaksana kontrak punya <b>excess capacity</b> dan setuju dengan <b>harga yang sama</b>.</li>\n    <li>Amandemen tambah pihak <b>tidak boleh</b> diikuti kenaikan nilai kontrak.</li>\n    <li>Nilai kontrak turunan maksimal sama dengan sisa nilai yang belum dimanfaatkan.</li>\n  </ul>"}, {"book": "pedoman", "sec": "04 · Non-Tender", "ref": "Bab V.D.2–3", "kick": "Belanja cepat", "title": "e-Purchasing & pembelian langsung", "c": "--c:var(--red)", "html": "<div class=\"grid2\">\n    <div class=\"box s\"><span class=\"tag\">OA Catalog</span><br>Barang/jasa dari Kontrak Payung. Ikuti ketentuan Kontrak Payung.</div>\n    <div class=\"box s\"><span class=\"tag\">e-Catalog</span><br>Bandingkan harga antar pelaksana e-Catalog untuk spesifikasi yang diminta FPP.</div>\n  </div>\n  <h2>Buyer Purchase <span class=\"tag n\" style=\"margin-left:4px\">Procurement</span></h2>\n  <ul class=\"d\">\n    <li>Beli langsung (toko, bengkel, online, perorangan, dll.) dengan <b>harga pasar</b>.</li>\n    <li>Hanya untuk barang/jasa yang <b>belum ada di Sistem Catalog</b>.</li>\n    <li>Bayar via Cash Card, Procurement Card, atau tagihan penyedia.</li>\n  </ul>\n  <h2>User Purchase <span class=\"tag g\" style=\"margin-left:4px\">FPP</span></h2>\n  <p style=\"margin-bottom:.32px\">Untuk spesifikasi jelas dengan harga <i>published rate</i>, contohnya:</p>\n  <div class=\"grid2\">\n    <ul class=\"d\"><li>Jasa pos/ekspedisi</li><li>Uji laboratorium</li><li>Meterai, perangko, voucher</li><li>Hotel &amp; tiket perjalanan</li><li>Listrik, telepon, air</li></ul>\n    <ul class=\"d\"><li>Jurnal, lisensi, langganan</li><li>Iuran keanggotaan</li><li>Sparepart langsung ke bengkel</li><li>Iklan pengadaan</li><li>Workshop, kursus, pameran</li></ul>\n  </div>\n  <div class=\"box g\" style=\"margin-top:4px\"><b>Event organizer</b> juga bisa lewat User Purchase. Utamakan Anak Perusahaan/Afiliasi Pertamina yang kompeten.</div>"}, {"book": "pedoman", "sec": "04 · Swakelola", "ref": "Bab V.E", "kick": "Dikerjakan sendiri", "title": "Swakelola", "c": "--c:var(--red)", "html": "<h2>Kapan dipakai</h2>\n  <ul class=\"d\">\n    <li>Mengoptimalkan sumber daya sendiri atau meningkatkan kemampuan SDM.</li>\n    <li>Barang/jasa <b>tidak disediakan atau tidak diminati</b> pelaku usaha (nilai kecil, lokasi sulit).</li>\n    <li>Bisa dikerjakan non-pelaku usaha: lembaga pemerintah, perguruan tinggi, lembaga ilmiah, ormas/kelompok masyarakat.</li>\n  </ul>\n  <h2>Dua jenis</h2>\n  <div class=\"grid2\">\n    <div class=\"box s\"><b>Oleh FPP sendiri</b><br>Rencana, pelaksanaan, dan pengawasan oleh FPP. Kebutuhan barang/jasa pendukung tetap ikut STK Pertamina Retail.</div>\n    <div class=\"box s\"><b>Oleh pihak lain</b><br>FPP merencanakan &amp; mengawasi; pelaksana adalah <b>non-pelaku usaha</b>, memakai aturan pengadaannya sendiri.</div>\n  </div>\n  <h2>Contoh pekerjaan</h2>\n  <ul class=\"d\">\n    <li>Acara penunjang FPP; pekerjaan bersifat rahasia.</li>\n    <li>Pemeliharaan rutin skala kecil, lokasi terpencil.</li>\n    <li>Litbang, pelatihan, seminar, sayembara/kontes.</li>\n    <li>Survei, sensus, pengolahan data, uji laboratorium.</li>\n    <li>Seleksi pekerja oleh lembaga/perguruan tinggi.</li>\n    <li>Produk kelompok masyarakat; konstruksi sederhana berbasis pemberdayaan masyarakat.</li>\n  </ul>"}, {"book": "pedoman", "sec": "05 · Jaminan", "ref": "Bab VI", "kick": "Pengaman risiko", "title": "Jaminan pengadaan", "c": "--c:var(--navy)", "html": "<p class=\"lead\">Jenis dan besaran jaminan <b>ditentukan FPP di DP3</b>, lalu masuk rancangan kontrak.</p>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Bank garansi dari Bank BUMN/BUMD, LPEI, atau bank umum swasta nasional (<b>bukan BPR</b>), atau <i>surety bond</i> dari asuransi Anak Perusahaan/Afiliasi Pertamina.</li>\n    <li>Wajib <b>tanpa syarat</b> (<i>unconditional</i>), mudah dicairkan, mata uang sama dengan kontrak, cair maks. <b>30 hari kerja</b>.</li>\n    <li>Konsultansi non-konstruksi: <b>tanpa</b> jaminan pelaksanaan &amp; pemeliharaan.</li>\n  </ul>\n  <h2 style=\"--c:var(--red)\">Jaminan sanggahan</h2>\n  <p><b>2‰</b> dari harga penawaran penyanggah, maks. <b>Rp50 jt</b>. Dikembalikan bila sanggahan terbukti benar.</p>\n  <h2 style=\"--c:var(--red)\">Jaminan pelaksanaan</h2>\n  <p style=\"margin-bottom:4px\">Untuk nilai <b>&gt; Rp1 M</b> (kecuali Sinergi, PL sole source, konsultansi non-konstruksi). FPP wajib membuat <b>risk assessment</b>:</p>\n  <div style=\"display:grid;grid-template-columns:124px 1fr;gap:8px;align-items:center\">\n    <div>\n      <div class=\"mx\">\n        <div class=\"l2\">5</div><div class=\"l4\">10</div><div class=\"l5\">15</div><div class=\"l5\">20</div><div class=\"l5\">25</div>\n        <div class=\"l2\">4</div><div class=\"l3\">8</div><div class=\"l4\">12</div><div class=\"l5\">16</div><div class=\"l5\">20</div>\n        <div class=\"l1\">3</div><div class=\"l3\">6</div><div class=\"l3\">9</div><div class=\"l4\">12</div><div class=\"l5\">15</div>\n        <div class=\"l1\">2</div><div class=\"l2\">4</div><div class=\"l3\">6</div><div class=\"l3\">8</div><div class=\"l4\">10</div>\n        <div class=\"l1\">1</div><div class=\"l1\">2</div><div class=\"l1\">3</div><div class=\"l2\">4</div><div class=\"l3\">5</div>\n      </div>\n      <div class=\"small\" style=\"text-align:center;margin-top:.24px\">Probabilitas (↑) × Dampak (→)</div>\n    </div>\n    <table style=\"margin:0\">\n      <tr><th>Skor</th><th>Jaminan</th></tr>\n      <tr><td>1–3 Low</td><td>Tidak perlu</td></tr>\n      <tr><td>4</td><td>5%</td></tr>\n      <tr><td>5–9</td><td>10%</td></tr>\n      <tr><td>10–12</td><td>15%</td></tr>\n      <tr><td>15–20 High</td><td>20%</td></tr>\n    </table>\n  </div>"}, {"book": "pedoman", "sec": "05 · Jaminan", "ref": "Bab VI.D–F", "kick": "Lanjutan", "title": "Pelaksanaan, uang muka, pemeliharaan", "c": "--c:var(--navy)", "html": "<h2 style=\"--c:var(--red)\">Jaminan pelaksanaan: aturan main</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Diserahkan <b>sebelum tanda tangan kontrak</b> atau SP3MK.</li>\n    <li>Berlaku minimal selama jangka waktu pekerjaan.</li>\n    <li>Perpanjangan diminta paling lambat <b>20 hari kerja</b> sebelum habis; bila belum masuk, pembayaran senilai jaminan bisa ditahan.</li>\n    <li>Penawaran ≤ 80% HPS/OE → besaran jaminan bisa disesuaikan lewat <i>risk assessment</i> ulang.</li>\n    <li>Dicairkan bila pelaksana mundur atau kontrak diputus.</li>\n  </ul>\n  <h2 style=\"--c:var(--red)\">Uang muka</h2>\n  <table>\n    <tr><th>Penyedia</th><th style=\"width:64px\">Maks.</th></tr>\n    <tr><td>Anak Perusahaan/Afiliasi Pertamina</td><td><b>20%</b></td></tr>\n    <tr><td>Non-afiliasi, golongan usaha kecil</td><td><b>15%</b></td></tr>\n    <tr><td>Non-afiliasi menengah/besar, atau jasa konsultansi</td><td><b>10%</b></td></tr>\n  </table>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Wajib <b>jaminan uang muka</b> senilai uang muka (kecuali Sinergi).</li>\n    <li>Uang muka lunas paling lambat saat prestasi <b>100%</b>.</li>\n  </ul>\n  <h2 style=\"--c:var(--red)\">Jaminan pemeliharaan</h2>\n  <p>Untuk konstruksi/jasa yang butuh masa pemeliharaan: jaminan atau retensi <b>5%</b> dari nilai kontrak.</p>"}, {"book": "pedoman", "sec": "06 · Kontrak", "ref": "Bab VII", "kick": "Kenali bentuknya", "title": "Bentuk & jenis kontrak", "c": "--c:var(--navy)", "html": "<div class=\"box s\"><b>Bentuk:</b> Surat Perjanjian, atau kontrak sederhana (Purchase Order, kuitansi/bukti pembelian, SPK).</div>\n  <div class=\"grid2\" style=\"margin-top:5.6px\">\n    <div class=\"box o\"><span class=\"tag\">Perikatan harga</span>\n      <ul class=\"d\" style=\"margin-top:4px\"><li><b>Harga satuan</b>: bayar per volume diterima</li><li><b>Lumpsum</b>: harga pasti, risiko di pelaksana</li><li>Gabungan satuan + lumpsum</li><li>Cost plus fee</li><li>Insentif</li><li>Persentase</li><li>Price agreement</li></ul></div>\n    <div class=\"box o\"><span class=\"tag g\">Kriteria kinerja</span>\n      <ul class=\"d\" style=\"margin-top:4px;--c:var(--green)\"><li>Turn key</li><li>Performance contract</li><li>Kemitraan/aliansi strategis</li></ul>\n      <span class=\"tag r\" style=\"margin-top:4px\">Para pihak</span>\n      <ul class=\"d\" style=\"margin-top:4px;--c:var(--red)\"><li>Sharing contract</li><li>Kontrak Payung (OA)</li><li>Multi winner</li></ul></div>\n  </div>\n  <div class=\"box o\"><span class=\"tag n\">Mekanisme pelaksanaan</span>\n    <div class=\"grid2\" style=\"margin-top:4px\"><ul class=\"d\" style=\"--c:var(--navy)\"><li>Call of order</li><li>Konsinyasi</li><li>Technical OA (TOA)</li></ul><ul class=\"d\" style=\"--c:var(--navy)\"><li>Vendor Managed Inventory</li><li>Pemeliharaan</li><li>Operation &amp; Maintenance</li></ul></div>\n  </div>\n  <div class=\"key\"><b>Multi winner:</b> PO/SPK diberikan ke peringkat 1 dulu; bila tak mampu, turun ke peringkat 2, dan seterusnya.</div>"}, {"book": "pedoman", "sec": "06 · Manajemen Kontrak", "ref": "Bab VIII–X", "kick": "Sampai tuntas", "title": "Mengelola & menutup kontrak", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Pastikan pekerjaan sesuai <b>lingkup, biaya, waktu</b>, regulasi, dan HSSE Plan.</li>\n    <li>Kenakan <b>denda keterlambatan</b> (potong pembayaran atau cairkan jaminan) dan sanksi sesuai Tabel Penilaian Kinerja.</li>\n    <li>Siapkan kontrak pengganti untuk kebutuhan rutin; arsipkan dokumen lengkap.</li>\n  </ul>\n  <h2 style=\"--c:var(--red)\">Amandemen kontrak</h2>\n  <p>Boleh untuk kondisi tertentu: darurat/force majeure, perubahan regulasi, perubahan di luar kendali, tambah waktu untuk memakai sisa nilai, dll. <b>Total tambahan nilai maks. 10%</b> dari nilai kontrak awal.</p>\n  <h2 style=\"--c:var(--red)\">Penutupan kontrak</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Pastikan semua lingkup selesai; pekerjaan di luar lingkup sudah diamandemen.</li>\n    <li>Serah terima, tetapkan sisa material/scrap, bayar termin terakhir setelah denda beres, kembalikan jaminan.</li>\n  </ul>\n  <h2 style=\"--c:var(--green)\">Penilaian kinerja penyedia</h2>\n  <p style=\"margin-bottom:4px\">Poin (+) untuk prestasi, (−) untuk pelanggaran. Kategori:</p>\n  <div style=\"display:flex;gap:4px\"><span class=\"tag g\">Hijau</span><span class=\"tag\" style=\"background:#e3b505\">Kuning</span><span class=\"tag r\">Merah</span><span class=\"tag\" style=\"background:#111\">Hitam</span></div>\n  <h2 style=\"--c:var(--blue)\">Pengecualian STK</h2>\n  <p>Butuh <b>Ijin Prinsip</b> dari pejabat minimal satu tingkat di atas Pejabat Berwenang FPP, lalu ditelaah <b>Procurement Committee</b>.</p>\n  <div class=\"box s\"><b>Tidak diatur pedoman ini</b> (punya STK khusus): BBM, barang DC Bright, jasa keuangan/asuransi, konsultan hukum, penyelesaian aset non-advokat, layanan kesehatan, pengurusan perizinan, jasa penagihan, pengadaan tanah, Kantor Akuntan Publik.</div>"}], "tko": [{"book": "tko", "sec": "01 · Dasar", "ref": "Bab I–II, VIII", "kick": "Kenapa ada TKO ini", "title": "Tujuan & pelaksana", "c": "--c:var(--blue)", "html": "<h2>Tujuan</h2>\n  <ul class=\"d\"><li>Menyamakan pemahaman dan jadi acuan pelaku pengadaan dalam <b>memilih penyedia</b>.</li><li>Pemilihan penyedia sesuai tujuan, kebijakan, prinsip, dan etika pengadaan.</li></ul>\n  <h2>Ruang lingkup</h2>\n  <p>Seluruh pelaksanaan pemilihan penyedia untuk memenuhi kebutuhan barang/jasa di Pertamina Retail.</p>\n  <h2>Pelaksana pemilihan</h2>\n  <ul class=\"d\"><li><b>Fungsi Procurement</b>. Pejabatnya bertanggung jawab atas proses dan menyampaikan <b>LHP</b> ke Pejabat Berwenang FPP.</li>\n  <li>Pekerja pelaksana wajib menguasai STK pengadaan dan bagian Dokumen Pemilihan yang jadi tugasnya, memahami kebijakan/prinsip/etika, dan diutamakan sudah ikut pelatihan STK.</li></ul>\n  <table><tr><th>Otorisasi nilai pekerjaan (Kantor Pusat)</th><th>Pengusul LHP</th></tr>\n  <tr><td>Pejabat setingkat VP ke atas</td><td>Manager Procurement</td></tr>\n  <tr><td>Pejabat setingkat Manager</td><td>Pejabat satu tingkat di bawah pejabat tertinggi Procurement</td></tr></table>\n  <h2>Ukuran keberhasilan</h2>\n  <ul class=\"d\"><li>Efektif, efisien, bertanggung jawab, dan hati-hati.</li><li>Permintaan yang tidak direncanakan FPP tetap terkendali.</li><li>Barang/jasa sesuai syarat, harga paling efisien, tepat waktu.</li></ul>"}, {"book": "tko", "sec": "01 · Dasar", "ref": "Bab III.A", "kick": "Kamus singkat", "title": "Istilah penting", "c": "--c:var(--blue)", "html": "<div class=\"term\"><b>SAPP</b><span>Sistem Aplikasi Procurement Pertamina, kanal utama pemilihan penyedia.</span></div>\n  <div class=\"term\"><b>Bidder List</b><span>Daftar calon peserta yang mendaftar mengikuti pemilihan.</span></div>\n  <div class=\"term\"><b>Dokumen Pemilihan</b><span>Dokumen Penilaian Kualifikasi + Dokumen Tender.</span></div>\n  <div class=\"term\"><b>Dok. Kualifikasi</b><span>Persyaratan kualifikasi umum dan kualifikasi khusus (bila ada).</span></div>\n  <div class=\"term\"><b>Dokumen Tender</b><span>IKPP + rancangan kontrak (berisi Lingkup Kerja).</span></div>\n  <div class=\"term\"><b>IKPP</b><span>Instruksi &amp; Ketentuan Pelaksanaan Pemilihan: cara menyampaikan penawaran, syarat di luar kualifikasi khusus, dll.</span></div>\n  <div class=\"term\"><b>Klarifikasi</b><span>Permintaan penjelasan atas penawaran oleh Procurement; hasilnya dicatat dalam risalah.</span></div>\n  <div class=\"term\"><b>Diskualifikasi</b><span>Penawaran tidak lengkap/tidak sesuai/tidak memenuhi syarat administrasi, teknis, atau komersial; tidak dievaluasi lanjut.</span></div>\n  <div class=\"term\"><b>Hubungan Istimewa</b><span>Penyedia yang dikendalikan pihak yang sama: &gt;50% pemegang saham dan/atau salah satu pengurusnya sama. <b>Dilarang bersaing</b> dalam satu pemilihan (kecuali grup Pertamina &amp; BUMN).</span></div>\n  <div class=\"term\" style=\"border:none\"><b>Pimpinan Penyedia</b><span>Direksi di akta pendirian, penerima kuasanya, kepala cabang yang diangkat kantor pusat, atau pejabat lead firm konsorsium.</span></div>"}, {"book": "tko", "sec": "01 · Peran", "ref": "Bab VI–VII", "kick": "Siapa melakukan apa", "title": "Peta peran pemilihan", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:96px\">Pelaku</th><th>Tugas dalam pemilihan</th></tr>\n    <tr><td><b>FPP</b></td><td>DP3 &amp; HPS/OE, PR, kualifikasi khusus, penjelasan pre-bid, evaluasi teknis &amp; HSSE Plan, ikut evaluasi administrasi/komersial &amp; negosiasi</td></tr>\n    <tr><td><b>Pejabat Berwenang FPP</b></td><td>Setujui PR &amp; HPS/OE, setujui/tolak LHP, menetapkan pemenang, menetapkan pembatalan, tanda tangan kontrak</td></tr>\n    <tr><td><b>Fungsi Procurement</b></td><td>Review DP3, pra-tender, Dokumen Pemilihan, pengumuman/undangan, pembukaan, evaluasi, negosiasi, LHP, sanggahan, penunjukan, kontrak &amp; distribusi</td></tr>\n    <tr><td><b>Tim Registrasi</b></td><td>Penilaian kualifikasi umum (bila ada peserta non-DPT)</td></tr>\n    <tr><td><b>Fungsi terkait</b></td><td>Hukum, Keuangan, HSSE dilibatkan sesuai kebutuhan (pra-tender, evaluasi, sanggahan)</td></tr>\n    <tr><td><b>Procurement Committee</b></td><td>Menyetujui permintaan di luar PPL &amp; pengecualian STK (ijin prinsip)</td></tr>\n    <tr><td><b>Komite Sanksi</b></td><td>Bila diperlukan, terkait sanksi penyedia</td></tr>\n    <tr><td><b>Penyedia</b></td><td>Mendaftar, kualifikasi, penawaran, penegasan harga, tanda tangan kontrak, jaminan pelaksanaan</td></tr>\n  </table>"}, {"book": "tko", "sec": "01 · Peran FPP", "ref": "Bab VII.C", "kick": "Jangan sampai terlewat", "title": "Checklist FPP", "c": "--c:var(--green)", "html": "<ol class=\"n\" style=\"--c:var(--green)\">\n    <li>Pastikan kebutuhan ada di <b>PPL</b> (atau sudah disetujui Procurement Committee).</li>\n    <li>Siapkan <b>DP3 lengkap</b>, HPS/OE yang disahkan, dan <b>PR</b> yang disetujui.</li>\n    <li>Kirim <b>memorandum permintaan</b> + DP3 ke Procurement.</li>\n    <li>Segera <b>lengkapi kekurangan DP3</b> hasil review Procurement.</li>\n    <li>Hadiri <b>rapat pra-tender</b>; tindak lanjuti rekomendasinya.</li>\n    <li>Lakukan <b>kualifikasi khusus</b> bersama Procurement.</li>\n    <li>Beri penjelasan di <b>pre-bid/tinjauan lokasi</b>; tanda tangani BA Penjelasan.</li>\n    <li>Tanda tangani <b>BA Pembukaan</b>; ikut evaluasi administrasi.</li>\n    <li>Lakukan <b>evaluasi teknis &amp; HSSE Plan</b>.</li>\n    <li>Ikut <b>evaluasi komersial, klarifikasi &amp; negosiasi</b>; tanda tangani BA Negosiasi/Harga Timpang.</li>\n    <li>Revisi PR bila lebih kecil dari HPS/OE <b>sebelum LHP disetujui</b>.</li>\n    <li>Bantu jawaban <b>sanggahan</b> bila diminta.</li>\n    <li>Terima salinan kontrak; mulai pengawasan.</li>\n  </ol>"}, {"book": "tko", "sec": "02 · DP3", "ref": "Bab III.B.3 (1)", "kick": "DP3 · bagian 1", "title": "Lingkup pekerjaan", "c": "--c:var(--green)", "html": "<div class=\"grid2\">\n    <div class=\"box s\"><span class=\"tag\">Barang, konstruksi, jasa lainnya</span>\n      <ul class=\"d\" style=\"margin-top:4px\"><li>Jenis &amp; uraian pekerjaan / spesifikasi barang</li><li>Cara melaksanakan pekerjaan</li><li>Jenis, jumlah &amp; mutu bahan</li><li>Tata cara, waktu, tempat penyerahan (delivery terms ikut standar dagang)</li></ul></div>\n    <div class=\"box s\"><span class=\"tag g\">Jasa konsultansi</span>\n      <ul class=\"d\" style=\"margin-top:4px;--c:var(--green)\"><li>Latar belakang, maksud &amp; tujuan, lokasi, ruang lingkup</li><li>Deliverable/output</li><li>Waktu pelaksanaan</li><li>Kompetensi tenaga ahli &amp; badan usaha</li></ul></div>\n  </div>\n  <h2>Sertifikat garansi (bila dipersyaratkan)</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Menjamin suku cadang, fasilitas &amp; layanan purna jual tersedia.</li>\n    <li>Barang <b>asli, baru</b> (produksi tahun terakhir), belum dipakai, <b>bukan rekondisi</b>; spesifikasi sesuai kontrak.</li>\n    <li>Perlindungan sesuai garansi OEM; diterbitkan produsen atau pihak yang sah ditunjuk.</li>\n    <li>Berlaku sejak barang <b>diterima</b> Pertamina, terlepas dari lama pengiriman.</li>\n    <li>Barang cacat selama garansi → <b>FPP lapor tertulis</b>, pelaksana wajib memperbaiki/mengganti.</li>\n  </ul>"}, {"book": "tko", "sec": "02 · DP3", "ref": "Bab III.B.3 (2)", "kick": "DP3 · bagian 2", "title": "Aspek finansial", "c": "--c:var(--green)", "html": "<ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Ketentuan <b>pembayaran</b> atas prestasi.</li>\n    <li>Ketentuan <b>denda</b>.</li>\n    <li>Besaran <b>uang muka</b> (down payment) dan/atau <b>advance payment</b>.</li>\n    <li>Jenis &amp; besaran <b>jaminan</b> pengadaan.</li>\n    <li>Ketentuan <b>penyesuaian harga</b> (bila ada).</li>\n  </ul>\n  <div class=\"box g\"><b>Advance payment</b>: pembayaran sebelum barang/jasa diterima sesuai praktik bisnis, mis. sewa gedung atau asuransi. <b>Tidak memerlukan jaminan.</b></div>\n  <h2>Penyesuaian harga</h2>\n  <ol class=\"n\" style=\"--c:var(--green)\">\n    <li>Hanya untuk kontrak <b>harga satuan multi years</b> dengan masa pelaksanaan <b>&gt; 12 bulan</b>.</li>\n    <li>Tata cara hitungnya wajib jelas di Dokumen Tender (bagian rancangan kontrak).</li>\n    <li>Berlaku mulai <b>bulan ke-13</b> sejak kontrak berjalan, sesuai jadwal di kontrak.</li>\n    <li>Berlaku untuk semua mata pembayaran, <b>kecuali</b> keuntungan, overhead, dan harga satuan timpang.</li>\n    <li>Pekerjaan baru akibat amandemen: mulai bulan ke-13 sejak amandemen ditandatangani.</li>\n  </ol>"}, {"book": "tko", "sec": "02 · DP3", "ref": "Bab III.B.3 (3–10)", "kick": "DP3 · bagian 3", "title": "Kriteria & kelengkapan lain", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:20px\">#</th><th>Isi DP3</th><th>Catatan</th></tr>\n    <tr><td>3</td><td><b>Risk assessment HSSE</b></td><td>Tetapkan risiko pekerjaan &amp; syarat HSSE peserta</td></tr>\n    <tr><td>4</td><td><b>Kriteria kualifikasi khusus</b></td><td>Bila ada</td></tr>\n    <tr><td>5</td><td><b>Syarat &amp; kriteria evaluasi teknis</b></td><td>Scoring: tetapkan bobot tiap kriteria &amp; sub kriteria</td></tr>\n    <tr><td>6</td><td><b>Kriteria evaluasi komersial</b></td><td>Lumpsum atau itemized</td></tr>\n    <tr><td>7</td><td><b>Jenis kontrak</b></td><td>Harga satuan, lumpsum, dll.</td></tr>\n    <tr><td>8</td><td><b>HPS/OE</b></td><td>Termasuk HPS/OE penyesuaian</td></tr>\n    <tr><td>9</td><td><b>Purchase Requisition</b></td><td>Bukti ketersediaan anggaran</td></tr>\n    <tr><td>10</td><td><b>Ijin prinsip</b></td><td>Bila ada pengecualian STK, disetujui pejabat satu tingkat di atas Pejabat Berwenang</td></tr>\n  </table>\n  <div class=\"key\"><b>Kenapa penting:</b> kriteria evaluasi yang ditulis di DP3 akan masuk Dokumen Tender. Setelah Dokumen Tender, risalah pre-bid, atau amandemennya terbit, <b>kriteria tidak boleh ditambah/dikurangi</b>.</div>"}, {"book": "tko", "sec": "02 · HPS/OE", "ref": "Bab III.B.3 (8)", "kick": "Tanggung jawab FPP", "title": "HPS/OE", "c": "--c:var(--green)", "html": "<ol class=\"n\" style=\"--c:var(--green)\">\n    <li>Perkiraan harga yang <b>dikalkulasi secara keahlian</b>, acuan menilai kewajaran harga.</li>\n    <li>Penyusunan &amp; pengesahan (termasuk HPS penyesuaian) adalah <b>tanggung jawab FPP</b>.</li>\n    <li>Boleh dibantu fungsi teknis atau tenaga ahli/konsultan. <b>Konsultan penyusun dilarang ikut</b> pemilihan terkait.</li>\n    <li>Harga publik (media massa, jurnal, internet) boleh jadi referensi.</li>\n    <li><b>Rahasia.</b> Nilai total boleh dibuka saat penunjukan pemenang; <b>rincian tetap rahasia</b>.</li>\n    <li>Diserahkan paling lambat <b>sebelum pembukaan penawaran komersial</b>.</li>\n    <li>Penyusunan mengacu STK terkait.</li>\n  </ol>\n  <h2>HPS/OE tidak wajib untuk</h2>\n  <div class=\"grid2\">\n    <div class=\"chip\"><b>e-Purchasing</b><span>Lewat Sistem Catalog</span></div>\n    <div class=\"chip\"><b>Buyer &amp; User Purchase</b><span>Pengadaan langsung</span></div>\n    <div class=\"chip\"><b>PL ke sole source</b><span>Wajib ada factory/manufacture quotation</span></div>\n    <div class=\"chip\"><b>Swakelola oleh FPP</b><span>Tanpa barang/jasa pendukung</span></div>\n  </div>\n  <p class=\"small\" style=\"margin-top:4px\">Untuk swakelola oleh FPP cukup dibuat <b>RAB</b> yang disetujui Pejabat Berwenang.</p>"}, {"book": "tko", "sec": "02 · Anggaran &amp; Syarat Mulai", "ref": "Bab III.B.3 (9), C.1", "kick": "Sebelum proses jalan", "title": "PR & syarat mulai", "c": "--c:var(--green)", "html": "<h2>Purchase Requisition (PR)</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Memastikan <b>anggaran tersedia</b>; disetujui Pejabat Berwenang FPP.</li>\n    <li>Dikecualikan untuk pengadaan program PKBL.</li>\n    <li>Nilai PR <b>minimal sama</b> dengan HPS/OE.</li>\n  </ul>\n  <div class=\"box r\"><b>PR &lt; HPS/OE?</b> Pejabat Berwenang (atau yang diberi wewenang) menyampaikan justifikasi ke Procurement, dan <b>PR wajib direvisi sebelum LHP disetujui</b>. HPS/OE disesuaikan melebihi PR → PR ikut disesuaikan.</div>\n  <h2>Pemilihan bisa dimulai bila</h2>\n  <ol class=\"n\" style=\"--c:var(--green)\">\n    <li>Kebutuhan sudah ada di <b>PPL</b>, atau disetujui <b>Procurement Committee</b> bila di luar PPL;</li>\n    <li><b>Memorandum permintaan + DP3</b> sudah diserahkan FPP;</li>\n    <li>Rekomendasi rapat pra-tender sudah dipenuhi FPP (bila ada);</li>\n    <li>Rekomendasi Procurement Committee dipenuhi (bila ada pengecualian STK lewat ijin prinsip).</li>\n  </ol>\n  <p class=\"small\">Pemilihan dimulai sejak permintaan disampaikan <b>lengkap dan benar</b> oleh FPP.</p>"}, {"book": "tko", "sec": "02 · Persiapan", "ref": "Bab III.C.2, C.4", "kick": "Persiapan", "title": "Kanal & rapat awal", "c": "--c:var(--green)", "html": "<h2>SAPP atau e-mail</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Pada prinsipnya lewat <b>SAPP</b> dan sistem pendukungnya.</li>\n    <li>E-mail boleh atas pertimbangan Procurement, FPP &amp; fungsi terkait bila: peserta di luar negeri tak bisa memakai SAPP, atau ada kendala penyampaian penawaran di SAPP.</li>\n    <li>Tahapan &amp; ketentuannya <b>sama</b> dengan lewat SAPP.</li>\n  </ul>\n  <h2>Rapat pra-tender</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li><b>Wajib</b> untuk semua pemilihan, kecuali: e-Purchasing, direct purchase, atau barang/jasa berspesifikasi jelas &amp; umum.</li>\n    <li>Diadakan Procurement dengan <b>mengundang FPP</b>; Hukum, Keuangan, HSSE dapat dilibatkan.</li>\n  </ul>\n  <div class=\"box s\"><b>Yang dikonfirmasi di rapat pra-tender</b>\n    <div class=\"grid2\" style=\"margin-top:4px\"><ul class=\"d\"><li>Lingkup kerja</li><li>Syarat kualifikasi khusus</li><li>Metode pemilihan</li></ul><ul class=\"d\"><li>Metode &amp; kriteria evaluasi</li><li>Ketentuan Dokumen Pemilihan</li><li>Jadwal pemilihan</li></ul></div></div>\n  <div class=\"key\"><b>Tips FPP:</b> bawa lingkup kerja, HPS/OE, dan kriteria evaluasi yang sudah matang. Kekurangan DP3 yang ditemukan di sini <b>harus segera dilengkapi</b>.</div>"}, {"book": "tko", "sec": "03 · Syarat Peserta", "ref": "Bab III.C.3", "kick": "Siapa boleh ikut", "title": "Syarat umum peserta", "c": "--c:var(--green)", "html": "<ol class=\"n\" style=\"--c:var(--green)\">\n    <li><b>PNS dan pegawai BUMN/BUMD dilarang</b> ikut sebagai peserta perorangan.</li>\n    <li><b>Jasa konstruksi</b>: badan usaha asing yang menawar lewat perusahaan nasional → perusahaan nasional itu harus lulus kualifikasi umum dan membawa surat kuasa.</li>\n    <li><b>BUMN/anak/afiliasi BUMN</b> (selain Pertamina) wajib menyerahkan: surat pernyataan status (tanpa rekayasa) dan salinan akta pendirian &amp; perubahan terakhir, termasuk akta induknya.</li>\n    <li>Bentuk <b>tunggal atau konsorsium</b>, dinyatakan saat menyerahkan dokumen kualifikasi.</li>\n    <li>Penyedia jasa konstruksi asing mengikuti <b>UU No. 2/2017</b> tentang Jasa Konstruksi.</li>\n    <li>Memenuhi <b>kualifikasi umum</b>: golongan usaha, bidang usaha, dan CSMS.</li>\n  </ol>\n  <div class=\"box r\"><b>Hubungan istimewa dilarang:</b> penyedia dengan &gt;50% pemegang saham atau pengurus yang sama tidak boleh bersaing di pemilihan yang sama. Saat evaluasi administrasi, peserta yang terafiliasi <b>semua penawarannya gugur</b>.</div>"}, {"book": "tko", "sec": "03 · Konsorsium", "ref": "Bab III.C.3 (4)", "kick": "Ikut bersama-sama", "title": "Ketentuan konsorsium", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:80px\">Hal</th><th>Ketentuan</th></tr>\n    <tr><td><b>Pembentukan</b></td><td>Peserta yang mendaftar boleh bergabung dengan pihak lain, baik yang mendaftar maupun tidak.</td></tr>\n    <tr><td><b>Status DPT</b></td><td>Tender Terbuka: DPT atau non-DPT. Tender Terbatas: <b>wajib DPT</b>.</td></tr>\n    <tr><td><b>Lead firm</b></td><td>Ada perusahaan asing → lead firm harus perusahaan dalam negeri/nasional.</td></tr>\n    <tr><td><b>Golongan usaha</b></td><td>Lead firm memenuhi golongan yang disyaratkan; anggota tidak melebihinya.</td></tr>\n    <tr><td><b>Bidang usaha</b></td><td>Min. satu pihak sesuai; lead firm &amp; anggota sesuai sub lingkup &amp; berpengalaman.</td></tr>\n    <tr><td><b>Lulus bila</b></td><td>Lead firm + min. <b>1 anggota</b> memenuhi kualifikasi umum &amp; khusus.</td></tr>\n    <tr><td><b>Setelah lulus</b></td><td>Anggota <b>tidak boleh</b> ditambah, diubah, atau diganti.</td></tr>\n  </table>\n  <h2>Isi perjanjian/nota kesepahaman konsorsium</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Tujuan &amp; jangka waktu konsorsium</li>\n    <li>Tanggung jawab bersama &amp; sendiri-sendiri (<i>jointly &amp; severally</i>)</li>\n    <li>Siapa lead firm; struktur &amp; keanggotaan</li>\n    <li>Berlaku minimal <b>1 tahun setelah kontrak berakhir</b></li>\n  </ul>"}, {"book": "tko", "sec": "03 · Golongan Usaha", "ref": "Bab III.C.3 (6)a", "kick": "Cocokkan nilainya", "title": "Golongan usaha", "c": "--c:var(--green)", "html": "<p class=\"small\" style=\"margin-bottom:.24px\">Batas nilai pengadaan per bidang usaha untuk peserta tunggal (tidak termasuk PPN)</p>\n  <table>\n    <tr><th>Golongan</th><th>Barang (P)</th><th>Konstruksi pelaksana (Q)</th><th>Konsultansi konstruksi (Q)</th><th>Jasa lainnya (R)</th></tr>\n    <tr><td><b>Perseorangan</b></td><td>≤ 50 jt</td><td>≤ 100 jt</td><td>≤ 200 jt</td><td>≤ 200 jt</td></tr>\n    <tr><td><b>Kecil (K)</b></td><td>≤ 500 jt</td><td>≤ 1 M</td><td>≤ 500 jt</td><td>≤ 500 jt</td></tr>\n    <tr><td><b>Menengah (M)</b></td><td>&gt;500 jt – 5 M</td><td>&gt;1 – 10 M</td><td>&gt;500 jt – 2 M</td><td>&gt;500 jt – 5 M</td></tr>\n    <tr><td><b>Besar (B)</b></td><td>&gt; 5 M</td><td>&gt; 10 M</td><td>&gt; 2 M</td><td>&gt; 5 M</td></tr>\n  </table>\n  <p class=\"small\">Konsultansi konstruksi = perencanaan/pengawasan. Jasa konsultansi non-konstruksi (S): <b>tanpa batasan</b> untuk semua golongan.</p>\n  <h2>Pengecualian kesesuaian golongan</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Anak Perusahaan/Afiliasi Pertamina yang ditunjuk lewat <b>Penunjukan</b> (golongan boleh lebih tinggi).</li>\n    <li>Penyedia <b>asing</b>, atau <b>pabrikan/agen tunggal/distributor tunggal</b> dalam maupun luar negeri.</li>\n    <li><b>Jasa konsultan non-konstruksi</b>.</li>\n  </ul>\n  <div class=\"box s\"><b>Contoh:</b> pengadaan barang senilai Rp800 jt (tanpa PPN) → peserta tunggal harus bergolongan <b>Menengah</b>.</div>"}, {"book": "tko", "sec": "03 · Bidang Usaha &amp; CSMS", "ref": "Bab III.C.3 (6)b–c", "kick": "Cocokkan keahlian &amp; risiko", "title": "Bidang usaha & CSMS", "c": "--c:var(--green)", "html": "<h2>Bidang usaha</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Peserta tunggal: bidang usaha harus <b>sesuai</b> pekerjaan.</li>\n    <li>Konsorsium: min. satu pihak sesuai; tiap pihak sesuai sub lingkup &amp; punya pengalaman.</li>\n  </ul>\n  <h2>Kualifikasi CSMS vs risiko HSSE</h2>\n  <table>\n    <tr><th>CSMS peserta ↓ / Risiko →</th><th>Tinggi</th><th>Menengah</th><th>Rendah</th></tr>\n    <tr><td><b>Tinggi (T)</b></td><td style=\"text-align:center\">✔</td><td style=\"text-align:center\">✔</td><td style=\"text-align:center\">✔</td></tr>\n    <tr><td><b>Menengah (M)</b></td><td style=\"text-align:center;color:var(--red)\">✘</td><td style=\"text-align:center\">✔</td><td style=\"text-align:center\">✔</td></tr>\n    <tr><td><b>Rendah (R)</b></td><td style=\"text-align:center;color:var(--red)\">✘</td><td style=\"text-align:center;color:var(--red)\">✘</td><td style=\"text-align:center\">✔</td></tr>\n  </table>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Risiko <b>Tinggi</b>: hanya CSMS Tinggi.</li>\n    <li>Risiko <b>Menengah</b>: CSMS Tinggi &amp; Menengah.</li>\n    <li>Risiko <b>Rendah</b>: semua kualifikasi CSMS.</li>\n    <li>Konsorsium: mengikuti STK Contractor Safety Management System.</li>\n  </ul>\n  <div class=\"key\"><b>Peran FPP:</b> tingkat risiko HSSE ditetapkan lewat <b>risk assessment di DP3</b>. Risiko yang ditetapkan menentukan siapa yang boleh ikut.</div>"}, {"book": "tko", "sec": "04 · Undangan", "ref": "Bab III.C.5–10", "kick": "Memanggil peserta", "title": "Pengumuman, undangan & dokumen", "c": "--c:var(--blue)", "html": "<table>\n    <tr><th style=\"width:84px\">Metode</th><th>Cara memanggil peserta</th></tr>\n    <tr><td><b>Tender Terbuka</b></td><td>Pengumuman di SAPP (DPT &amp; non-DPT), papan pengumuman, media cetak bila perlu</td></tr>\n    <tr><td><b>Tender Terbatas</b></td><td>Undangan SAPP + e-mail otomatis ke <b>semua DPT</b> yang memenuhi kualifikasi umum dan SKT-nya tidak dibekukan</td></tr>\n    <tr><td><b>PL / Penunjukan Sinergi</b></td><td>Undangan SAPP + e-mail otomatis hanya ke penyedia yang diundang</td></tr>\n  </table>\n  <p style=\"margin:4px 0 .24px\"><b>Isi pengumuman/undangan:</b> fungsi pengundang, judul &amp; nomor pemilihan, ringkasan lingkup kerja, syarat kualifikasi, syarat tunggal/konsorsium, periode pendaftaran.</p>\n  <h2>Penyampaian dokumen</h2>\n  <ul class=\"d\">\n    <li>Dokumen kualifikasi &amp; Dokumen Tender diunduh di SAPP (atau dikirim lewat e-mail) <b>sesuai jadwal</b>; di luar jadwal tidak bisa diunduh.</li>\n    <li><b>Dokumen Tender hanya untuk peserta yang lulus</b> kualifikasi umum &amp; khusus.</li>\n    <li>Penawaran hanya dari peserta yang lulus kualifikasi.</li>\n    <li>Hard copy penawaran hanya dari maks. <b>3 peserta terbaik</b> sebelum penunjukan pemenang.</li>\n  </ul>"}, {"book": "tko", "sec": "04 · Dokumen Pemilihan", "ref": "Bab III.C.11–12", "kick": "Isi paket", "title": "Dokumen & kualifikasi khusus", "c": "--c:var(--blue)", "html": "<ul class=\"d\">\n    <li>Bahasa Indonesia atau dwibahasa; bila beda tafsir, <b>Bahasa Indonesia yang mengikat</b>. Istilah/spesifikasi teknis &amp; gambar boleh berbahasa Inggris saja.</li>\n    <li>Syarat di Dokumen Tender <b>tidak diulang</b> di Dokumen Kualifikasi, dan sebaliknya.</li>\n    <li>Kualifikasi umum hanya diperlukan bila ada peserta <b>non-DPT</b>; boleh dinilai bersamaan dengan kualifikasi khusus.</li>\n  </ul>\n  <h2 style=\"--c:var(--red)\">Kualifikasi khusus (ditetapkan FPP)</h2>\n  <div class=\"box s\"><b>1. Pengalaman sejenis</b> min. <b>1× dalam 4 tahun terakhir</b> sejak tanggal pengumuman/undangan, sebagai pelaksana, lead firm, anggota konsorsium, atau subkon.\n    <ul class=\"d\" style=\"margin-top:.32px\"><li>Sebagai anggota/subkon: dihitung porsi pekerjaannya saja.</li><li>Tidak berlaku untuk pabrikan/agen &amp; distributor tunggal (barang), dan paket golongan kecil berisiko HSSE rendah.</li></ul></div>\n  <div class=\"grid3\">\n    <div class=\"chip\"><b>2. Keuangan</b><span>Sesuai syarat Fungsi Keuangan</span></div>\n    <div class=\"chip\"><b>3. Peralatan</b><span>Fasilitas/perlengkapan tertentu</span></div>\n    <div class=\"chip\"><b>4. Lainnya</b><span>Komitmen fasilitas khusus, tenaga ahli spesialis</span></div>\n  </div>"}, {"book": "tko", "sec": "04 · Dokumen Tender", "ref": "Bab III.C.13", "kick": "Aturan main tender", "title": "IKPP & tata waktu", "c": "--c:var(--blue)", "html": "<p>Dokumen Tender = <b>IKPP</b> + <b>rancangan kontrak</b> (lingkup kerja + general terms &amp; conditions).</p>\n  <h2>IKPP memuat</h2>\n  <div class=\"grid2\">\n    <ul class=\"d\"><li>Tata cara menyampaikan penawaran</li><li>Syarat, kriteria, metode &amp; batasan evaluasi</li><li>Kewajiban hadir pre-bid</li><li>Format/formulir penawaran</li><li>Aturan paket &amp; sub paket</li></ul>\n    <ul class=\"d\"><li>Metode negosiasi harga</li><li>Sanksi administrasi/finansial</li><li>Masa berlaku penawaran</li><li>Tempat pemilihan</li><li>Tata waktu pemilihan</li></ul>\n  </div>\n  <h2 style=\"--c:var(--red)\">Tata waktu</h2>\n  <div class=\"grid2\">\n    <div class=\"box r\"><span class=\"big\">60</span> hari kerja<br>Maks. pemilihan <b>barang</b></div>\n    <div class=\"box r\"><span class=\"big\">90</span> hari kerja<br>Maks. pemilihan <b>jasa</b></div>\n  </div>\n  <ul class=\"d\">\n    <li>Dihitung dari pengumuman sampai penunjukan pemenang, <b>di luar</b> proses persetujuan LHP.</li>\n    <li>Bisa disesuaikan Procurement bila pekerjaan kompleks.</li>\n    <li>Perubahan jadwal di SAPP wajib disertai <b>alasan</b> dan <b>Berita Acara</b>.</li>\n    <li>Persetujuan LHP oleh Pejabat Berwenang maks. <b>7 hari kerja</b>.</li>\n  </ul>"}, {"book": "tko", "sec": "04 · Pre-bid Meeting", "ref": "Bab III.C.14", "kick": "Menjelaskan pekerjaan", "title": "Pre-bid & tinjauan lokasi", "c": "--c:var(--blue)", "html": "<ul class=\"d\">\n    <li><b>Wajib</b> untuk semua metode, kecuali e-Purchasing, direct purchase, atau barang berspesifikasi jelas/umum.</li>\n    <li>Procurement + <b>FPP</b> (+ fungsi terkait) menjelaskan lingkup, kondisi lokasi &amp; sekitarnya, syarat &amp; ketentuan.</li>\n    <li>Diikuti peserta yang lulus kualifikasi; kewajiban hadir diatur di Dokumen Tender. Bisa diadakan lebih dari sekali.</li>\n  </ul>\n  <table>\n    <tr><th>Pertanyaan peserta</th><th>Cara Procurement menjawab</th></tr>\n    <tr><td>Lisan/tertulis saat pre-bid</td><td>Saat itu juga (masuk risalah), atau tertulis sesudahnya sesuai waktu di risalah</td></tr>\n    <tr><td>Tertulis setelah pre-bid, sebelum batas penawaran</td><td>Tanggapan tertulis; bila dokumen berubah → terbit <b>amandemen Dokumen Tender</b></td></tr>\n  </table>\n  <ul class=\"d\">\n    <li>Risalah (bagian dari IKPP) ditandatangani Procurement, <b>FPP</b>, fungsi terkait &amp; pimpinan penyedia yang hadir.</li>\n    <li>Salinan risalah &amp; amandemen dikirim ke peserta.</li>\n  </ul>\n  <div class=\"box s\"><b>Boleh tidak diadakan</b> pada tender ulang bila tidak ada perubahan Dokumen Tender, tidak ada peserta baru, dan tidak ada perubahan risalah/amandemen sebelumnya.</div>"}, {"book": "tko", "sec": "04 · Penawaran", "ref": "Bab III.C.15–16", "kick": "Menerima penawaran", "title": "Dokumen & metode sampul", "c": "--c:var(--blue)", "html": "<ul class=\"d\">\n    <li>Isi: penawaran <b>administrasi, teknis, HSSE Plan, komersial</b>.</li>\n    <li>Surat penawaran, Pakta Integritas, surat pernyataan di kop perusahaan, <b>bermeterai</b> (kecuali asing), bertanggal, ditandatangani pimpinan penyedia.</li>\n    <li>Masa berlaku penawaran harus sesuai; peserta <b>dilarang menambah syarat</b> sendiri.</li>\n  </ul>\n  <div class=\"box s\"><span class=\"tag\">1 tahap · 1 sampul</span><br>Lingkup kerja jelas &amp; pasti. Semua dokumen dalam satu sampul.</div>\n  <div class=\"box s\"><span class=\"tag g\">1 tahap · 2 sampul</span><br>Lingkup jelas, tapi teknis perlu dievaluasi mendalam dulu. <b>Sampul I</b>: administrasi, teknis, HSSE Plan. <b>Sampul II</b>: komersial. Disampaikan bersamaan.</div>\n  <div class=\"box r\"><span class=\"tag r\">2 tahap · 2 sampul</span><br>Teknologi canggih/kompleks, desain belum standar, banyak deviasi teknis. <b>Tahap I</b>: administrasi, teknis, HSSE + evaluasi &amp; negosiasi teknis untuk menyetarakan. <b>Tahap II</b>: hanya yang lulus menyampaikan harga, di waktu berbeda; tinggal memilih harga terendah.</div>"}, {"book": "tko", "sec": "05 · Pembukaan", "ref": "Bab III.C.17", "kick": "Saat sampul dibuka", "title": "Pembukaan penawaran", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Lewat SAPP/e-mail, peserta <b>tidak wajib hadir</b> (bisa diatur lain di Dokumen Tender).</li>\n    <li>Dibuka bila jumlah penawar memenuhi <b>minimum</b> (lihat tabel pemilihan ulang) dan dihadiri min. 1 peserta.</li>\n    <li>Lewat batas waktu: <b>tidak ada</b> penawaran atau perubahan yang diterima.</li>\n  </ul>\n  <div class=\"box r\"><b>Setelah dibuka:</b> Procurement tidak boleh mengubah Dokumen Tender/kriteria; peserta tidak boleh <i>post bidding</i>. Dokumen tambahan saat klarifikasi hanya boleh bila memperkuat penjelasan, bukan pengganti, bukan di luar syarat, bukan penawaran alternatif, dan tidak mengubah substansi teknis, HSSE, atau harga.</div>\n  <table>\n    <tr><th style=\"width:80px\">Metode</th><th>Urutan pembukaan</th></tr>\n    <tr><td><b>1 sampul</b></td><td>Buka semua → evaluasi administrasi, teknis, HSSE, komersial</td></tr>\n    <tr><td><b>2 sampul</b></td><td>Buka Sampul I → administrasi (BA) → teknis &amp; HSSE → Sampul II hanya untuk yang lulus</td></tr>\n    <tr><td><b>2 tahap</b></td><td>Buka tahap I (adm, teknis, HSSE) → tahap II (komersial) untuk yang lulus</td></tr>\n  </table>\n  <p class=\"small\">BA Pembukaan dibuat di hari yang sama, ditandatangani Procurement, <b>FPP</b> &amp; fungsi terkait.</p>"}, {"book": "tko", "sec": "05 · Evaluasi", "ref": "Bab III.C.18–19", "kick": "Prinsip evaluasi", "title": "Ketentuan umum & administrasi", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Tujuan: penawaran sah, memenuhi syarat, <b>paling menguntungkan</b> &amp; dapat dipertanggungjawabkan.</li>\n    <li>Dilakukan Procurement bersama <b>FPP</b> &amp; fungsi terkait sesuai kewenangan.</li>\n    <li>Urutan: administrasi → teknis → HSSE Plan → komersial.</li>\n    <li>HPS/OE jadi acuan kewajaran harga.</li>\n    <li>Penawaran alternatif hanya dievaluasi bila diatur, dari peserta yang penawaran utamanya terbaik dan sudah ≤ HPS/OE.</li>\n  </ul>\n  <h2 style=\"--c:var(--red)\">Penyimpangan pokok → gugur</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\"><li>Memengaruhi lingkup, kualitas, hasil/kinerja pekerjaan</li><li>Substansi tidak sesuai Dokumen Tender</li><li>Syarat tambahan dari peserta yang menimbulkan persaingan tak sehat</li></ul>\n  <h2>Evaluasi administrasi</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Cek kelengkapan; satu syarat tidak dipenuhi → <b>tidak lulus</b>.</li>\n    <li>Jangka waktu yang ditawarkan tidak melebihi Dokumen Tender.</li>\n    <li>Cek <b>afiliasi</b> antar peserta; yang terafiliasi semuanya gugur.</li>\n    <li>Hanya menilai hal yang belum dinilai saat registrasi/prakualifikasi.</li>\n    <li>Yang tidak lulus boleh mengambil kembali penawaran teknis &amp; harga.</li>\n  </ul>"}, {"book": "tko", "sec": "05 · Evaluasi Teknis", "ref": "Bab III.C.20–21", "kick": "Tugas utama FPP", "title": "Evaluasi teknis & HSSE", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Hanya untuk penawaran yang <b>lulus administrasi</b>.</li>\n    <li>Kriteria &amp; sub kriteria harus sama dengan Dokumen Tender dan pre-bid; <b>tidak boleh ditambah/dikurangi</b>.</li>\n  </ul>\n  <div class=\"grid2\">\n    <div class=\"box s\"><span class=\"tag\">Barang lulus bila</span>\n      <ul class=\"d\" style=\"margin-top:4px;\"><li>Spesifikasi sesuai contoh, brosur, gambar</li><li>Jadwal serah tidak lewat batas</li><li>Identitas barang lengkap &amp; jelas</li><li>Jumlah tidak kurang</li><li>Syarat teknis lain terpenuhi</li></ul></div>\n    <div class=\"box s\"><span class=\"tag g\">Jasa lulus bila</span>\n      <ul class=\"d\" style=\"margin-top:4px;--c:var(--green)\"><li>Metode kerja memenuhi syarat substantif</li><li>Jadwal tidak lewat batas</li><li>Volume &amp; spesifikasi sesuai</li><li>Personil inti sesuai organisasi</li><li>Subkon sesuai syarat</li></ul></div>\n  </div>\n  <h2>Klarifikasi te
