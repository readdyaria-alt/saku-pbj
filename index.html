knis</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>1 &amp; 2 sampul: klarifikasi boleh, <b>tanpa mengubah substansi</b>. 2 tahap: klarifikasi <b>dan negosiasi teknis</b>.</li>\n    <li>BA Hasil Klarifikasi dibuat hari itu juga, ditandatangani penyedia.</li>\n    <li>Yang tidak memenuhi teknis → tidak lulus; hasil Sampul I disampaikan tertulis.</li>\n  </ul>\n  <div class=\"box g\"><b>HSSE Plan</b> dievaluasi sesuai STK CSMS, bersama Fungsi HSSE bila perlu.</div>"}, {"book": "tko", "sec": "05 · Evaluasi Konsultansi", "ref": "Bab III.C.20 (6)", "kick": "Khusus konsultan", "title": "Teknis jasa konsultansi", "c": "--c:var(--navy)", "html": "<table>\n    <tr><th>Unsur pokok</th><th style=\"width:64px\">Bobot</th><th>Yang dinilai</th></tr>\n    <tr><td><b>Pengalaman</b></td><td>10–20%</td><td>Pekerjaan sejenis <b>5 tahun terakhir</b>, di Indonesia/luar negeri, manajerial, kapasitas tenaga ahli tetap; wajib ada referensi pengguna jasa</td></tr>\n    <tr><td><b>Pendekatan &amp; metodologi</b></td><td>20–45%</td><td>Pemahaman lingkup &amp; tujuan, kualitas metodologi, rencana kerja, deliverable, fasilitas; gagasan baru dapat nilai lebih</td></tr>\n    <tr><td><b>Kualifikasi tenaga ahli</b></td><td>45–60%</td><td>Pendidikan (terakreditasi, bukti ijazah), keahlian bersertifikat, pengalaman profesional, bahasa &amp; pengenalan kondisi setempat</td></tr>\n  </table>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Bobot dipilih dalam rentang sesuai jenis jasa.</li>\n    <li><b>Studi/analisis</b>: tekankan pengalaman &amp; metodologi. <b>Supervisi/perencanaan teknis</b>: tekankan tenaga ahli.</li>\n    <li>Kualifikasi melebihi syarat <b>tidak menambah nilai</b>.</li>\n  </ul>\n  <h2>Aspek yang bisa diklarifikasi</h2>\n  <div class=\"grid2\"><ul class=\"d\" style=\"--c:var(--navy)\"><li>Lingkup &amp; sarana</li><li>Cara kerja &amp; rencana kerja</li><li>Kualifikasi tenaga ahli</li><li>Organisasi pelaksanaan</li></ul><ul class=\"d\" style=\"--c:var(--navy)\"><li>Program alih pengetahuan</li><li>Jadwal pekerjaan</li><li>Jadwal penugasan personil</li><li>Fasilitas penunjang</li></ul></div>"}, {"book": "tko", "sec": "05 · Metode Evaluasi", "ref": "Bab III.C.23", "kick": "Pilih caranya", "title": "Scoring & non-scoring", "c": "--c:var(--navy)", "html": "<div class=\"box s\"><b>Scoring</b>: nilai kuantitatif per kriteria (mis. lingkup kerja, jadwal, tenaga ahli, metode, presentasi teknis) dengan bobot di Dokumen Tender. <b>Passing grade min. 75</b> dari 100; di bawahnya tidak lulus.</div>\n  <table>\n    <tr><th style=\"width:92px\">Varian scoring</th><th>Cara kerja</th></tr>\n    <tr><td><b>Kombinasi teknis + harga</b></td><td>Untuk yang lulus passing grade &amp; HSSE. <b>Nilai Akhir = skor teknis × (0,60–0,80) + skor harga × (0,20–0,40)</b>. Tertinggi terbaik; harga dibuka untuk semua yang lulus teknis.</td></tr>\n    <tr><td><b>Teknis lulus + harga terendah</b></td><td>Barang/jasa standar atau teknis sederhana. Urutan berdasarkan harga (boleh memperhitungkan biaya umur ekonomis).</td></tr>\n    <tr><td><b>Teknis terbaik</b></td><td>Pekerjaan kompleks, teknologi tinggi, butuh inovasi. Harga dibuka hanya untuk teknis tertinggi.</td></tr>\n  </table>\n  <div class=\"box o\"><b>Non-scoring</b>: lulus/tidak per tahap (administrasi → teknis → HSSE → kewajaran harga), lalu diurutkan berdasarkan harga. Cocok bila <b>lingkup/volume, spesifikasi, dan jadwal sudah pasti</b>.</div>\n  <h2>Membuka harga (sistem 2 sampul/2 tahap)</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\"><li>Evaluasi kualitas: hanya Sampul II peringkat teknis terbaik.</li><li>Kualitas + harga / komersial: Sampul II semua yang lulus teknis.</li></ul>"}, {"book": "tko", "sec": "05 · Evaluasi Komersial", "ref": "Bab III.C.22 (1–14)", "kick": "Menilai harga", "title": "Evaluasi komersial", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Pada prinsipnya dinilai <b>lumpsum</b>; itemized boleh bila item tidak saling tergantung dan tak harus diserahkan bersamaan (diatur di Dokumen Tender).</li>\n    <li>Harga ditulis dalam <b>angka dan huruf</b> yang sama.</li>\n  </ul>\n  <table>\n    <tr><th>Bila angka &amp; huruf berbeda</th><th>Yang dipakai</th></tr>\n    <tr><td>Ada perincian</td><td>Angka atau huruf yang sesuai perincian</td></tr>\n    <tr><td>Tidak ada perincian</td><td>Nilai huruf di surat penawaran</td></tr>\n    <tr><td>Angka = huruf, perincian beda</td><td>Angka &amp; huruf</td></tr>\n    <tr><td>Ketiganya berbeda</td><td><b style=\"color:var(--red)\">Tidak lulus</b></td></tr>\n  </table>\n  <h2>Koreksi aritmatik</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Salah kali volume × harga atau salah jumlah → dibetulkan; <b>harga satuan tidak boleh diubah</b>.</li>\n    <li>Item tanpa harga satuan dianggap sudah termasuk di item lain.</li>\n    <li>Koreksi boleh mengubah urutan; peserta menolak → <b>gugur</b>.</li>\n    <li>Tidak berlaku untuk konstruksi lumpsum (total tetap; risiko di penyedia).</li>\n    <li>Volume teknis ≠ volume harga → klarifikasi, harga satuan tetap.</li>\n  </ul>\n  <p>Perbedaan harga karena penggunaan bisa disetarakan dengan <b>total cost of ownership</b> (biaya selama umur ekonomis).</p>"}, {"book": "tko", "sec": "05 · Evaluasi Komersial", "ref": "Bab III.C.22 (15–17)", "kick": "Kasus khusus", "title": "Harga timpang & FTA", "c": "--c:var(--navy)", "html": "<div class=\"box r\" style=\"display:flex;gap:9.6px;align-items:center\"><span class=\"big\">&gt; 110%</span><span>Harga satuan penawaran di atas 110% harga satuan HPS → <b>wajib diklarifikasi</b> (kontrak harga satuan atau gabungan).</span></div>\n  <div class=\"flow\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">1</div><div class=\"t\"><b>Klarifikasi harga satuan</b><span>Bisa dipertanggungjawabkan/sesuai harga pasar → dinyatakan <b>tidak timpang</b>.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">2</div><div class=\"t\"><b>Dinyatakan timpang</b><span>Harga timpang hanya berlaku untuk volume di daftar kuantitas. Tambahan volume lewat amandemen dibayar dengan <b>harga satuan HPS</b>.</span></div></div>\n  </div>\n  <p class=\"small\">Dicatat dalam <b>BA Harga Timpang</b>, ditandatangani Procurement, FPP, fungsi terkait &amp; pimpinan penyedia.</p>\n  <h2>Barang impor &amp; Free Trade Agreement (FTA)</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Penawaran mengacu FTA → pembandingnya HPS/OE yang juga dihitung dengan FTA. Salah hitung tarif bea masuk setelah menang → biaya ditanggung penyedia.</li>\n    <li>Custom clearance oleh Pertamina Retail → pemenang ditetapkan berdasarkan <b>final cost (CIF + bea masuk)</b>.</li>\n    <li>FTA diterapkan bila barang diproduksi di negara asal penyedia, dokumen tersedia tanpa menambah waktu serah, dan biayanya tidak lebih besar dari tanpa FTA.</li>\n  </ul>"}, {"book": "tko", "sec": "06 · Negosiasi", "ref": "Bab III.C.24 (1–5)", "kick": "Menuju harga terbaik", "title": "Negosiasi harga", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Tata cara negosiasi dicantumkan di Dokumen Tender, sesuai metode pengadaan &amp; evaluasi.</li>\n    <li>Manual (tertulis/tatap muka) atau <b>e-ReverseAuction</b> (bidding room/remote).</li>\n  </ul>\n  <div class=\"grid2\">\n    <div class=\"box s\"><b>Tidak wajib</b><br>Sudah ada penawaran ≤ HPS/OE. Bila dilakukan, hanya ke penawar terbaik (yang sama → bersamaan).</div>\n    <div class=\"box r\"><b>Wajib</b><br>Semua penawaran <b>di atas</b> HPS/OE. Boleh beberapa putaran (<i>best effort</i>).</div>\n  </div>\n  <table><tr><th>Cara</th><th>Diikuti</th></tr><tr><td>Manual</td><td><b>3</b> peserta terbaik yang memenuhi syarat</td></tr><tr><td>e-ReverseAuction</td><td><b>5</b> peserta terbaik yang memenuhi syarat</td></tr></table>\n  <h2>Ketentuan Tender Terbuka &amp; Terbatas</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Penawaran <b>&lt; 80% HPS/OE</b> → klarifikasi kewajaran; jaminan pelaksanaan bisa dinaikkan s.d. <b>20%</b> dari penawaran.</li>\n    <li>Evaluasi kombinasi: urutan negosiasi mengikuti skor kombinasi terbaru.</li>\n    <li>Evaluasi teknis terbaik: negosiasi hanya dengan nilai teknis tertinggi; tidak sepakat → buka harga urutan berikutnya.</li>\n    <li>Sudah maksimal tapi tetap di atas HPS/OE → lapor Pejabat Berwenang: <b>gagal</b> atau HPS/OE disesuaikan.</li>\n  </ul>"}, {"book": "tko", "sec": "06 · Negosiasi", "ref": "Bab III.C.24 (6)–25", "kick": "Keputusan negosiasi", "title": "Hasil & Berita Acara", "c": "--c:var(--navy)", "html": "<div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">✓</div><div class=\"t\"><b>1 penawaran ≤ HPS/OE</b><span>Diusulkan sebagai calon pemenang.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">=</div><div class=\"t\"><b>&gt;1 penawaran sama &amp; ≤ HPS/OE</b><span>Negosiasi ulang bersamaan sampai ada 1 harga terendah.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:#e3a008\">↻</div><div class=\"t\"><b>Tak ada yang ≤ HPS/OE</b><span>HPS/OE ditinjau &amp; disesuaikan, lalu dicek ulang dengan aturan yang sama.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">✕</div><div class=\"t\"><b>Tetap di atas HPS/OE penyesuaian</b><span>Pengadaan dinyatakan gagal.</span></div></div>\n  </div>\n  <h2>Berita Acara proses pemilihan</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Dibuat di <b>hari yang sama</b> dengan pembukaan/evaluasi.</li>\n    <li>Memuat penawaran lengkap/tidak, kelainan &amp; kekurangan, serta peserta lulus/gugur tiap tahap.</li>\n    <li>Lewat SAPP: cukup ditandatangani Procurement.</li>\n    <li>Hasil negosiasi → <b>BA Hasil Negosiasi</b> (ditandatangani Procurement, FPP, fungsi terkait, pimpinan penyedia) dan dilaporkan ke Pejabat Berwenang.</li>\n    <li>Penawar terbaik menyampaikan <b>penegasan harga</b> hasil negosiasi.</li>\n  </ul>"}, {"book": "tko", "sec": "06 · Pemenang", "ref": "Bab III.C.26–28", "kick": "Keputusan", "title": "LHP & penetapan pemenang", "c": "--c:var(--red)", "html": "<ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Procurement mengusulkan <b>1 calon pemenang</b> + boleh 2 cadangan.</li>\n    <li><b>LHP</b> (ditandatangani pejabat Procurement) memuat: calon pemenang; semua peserta &amp; harga akhir/terkoreksi; metode, unsur &amp; formula evaluasi; tanggal BA &amp; jumlah lulus/gugur tiap tahap.</li>\n  </ul>\n  <div class=\"box s\"><b>Data pendukung penetapan:</b> HPS/OE sah · BA Penjelasan · BA Pembukaan · BA Evaluasi · BA Negosiasi · LHP · penawaran calon pemenang · <b>analisis tertulis bila harga &lt; 80% HPS/OE</b>.</div>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Pejabat Berwenang FPP menetapkan pemenang sesuai otorisasi, maks. <b>7 hari kerja</b>.</li>\n    <li><i>Joint procurement</i>: ditetapkan pejabat dengan kebutuhan terbesar, diparaf pejabat lain.</li>\n    <li>Tidak sependapat → dibahas (BA Usulan Penetapan Pemenang), lalu: setujui, minta evaluasi ulang, atau tetapkan pemenang lain dengan <b>justifikasi tertulis</b>.</li>\n  </ul>\n  <h2>Pengumuman</h2>\n  <p>Diumumkan lewat SAPP dan diberitahukan tertulis ke semua peserta, dengan catatan <b>belum final dan belum mengikat</b>.</p>"}, {"book": "tko", "sec": "06 · Sanggahan", "ref": "Bab III.C.29", "kick": "Keberatan peserta", "title": "Sanggahan", "c": "--c:var(--red)", "html": "<div class=\"grid3\">\n    <div class=\"box r\" style=\"margin:0\"><span class=\"big\">1</span> HK<br><span class=\"small\">atas hasil evaluasi teknis (2 sampul/2 tahap, bila diatur)</span></div>\n    <div class=\"box r\" style=\"margin:0\"><span class=\"big\">3</span> HK<br><span class=\"small\">atas penetapan pemenang + jaminan sanggahan</span></div>\n    <div class=\"box s\" style=\"margin:0\"><span class=\"big\" style=\"color:var(--blue)\">5</span> HK<br><span class=\"small\">jawaban Procurement, bersifat final</span></div>\n  </div>\n  <ul class=\"d\" style=\"--c:var(--red);margin-top:4.8px\">\n    <li><b>Materi</b>: penyimpangan prosedur, rekayasa, penyalahgunaan wewenang, KKN, keberatan hasil evaluasi.</li>\n    <li>Tertulis, ditandatangani pimpinan penyedia, ke pejabat Procurement (tembusan Pejabat Berwenang), dengan <b>bukti otentik</b>.</li>\n    <li><b>Yang berhak</b>: 1 sampul → yang menawar. 2 sampul → teknis: yang menawar; pemenang: yang harganya dibuka. 2 tahap → pemenang: yang menyampaikan harga.</li>\n    <li>Di luar ketentuan → jadi bahan evaluasi, tak wajib dijawab.</li>\n    <li>Procurement boleh melibatkan <b>FPP</b> menyiapkan jawaban.</li>\n  </ul>\n  <table><tr><th>Hasil</th><th>Tindak lanjut</th></tr>\n  <tr><td>Benar (teknis)</td><td>Hasil evaluasi diperbaiki &amp; diumumkan ulang</td></tr>\n  <tr><td>Benar (pemenang)</td><td>Usul anulir &amp; calon pemenang baru; jaminan dikembalikan</td></tr>\n  <tr><td>Tidak benar</td><td>Proses lanjut; <b>jaminan dicairkan</b></td></tr></table>"}, {"book": "tko", "sec": "06 · Penunjukan", "ref": "Bab III.C.30–32, 35", "kick": "Menuju kontrak", "title": "Penunjukan, SP3MK, kontrak", "c": "--c:var(--red)", "html": "<ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Penunjukan lewat <b>Surat Pemberitahuan Pemenang</b> bila tak ada sanggahan, sanggahan tidak benar, atau lewat masa sanggah.</li>\n    <li>Pemenang <b>wajib menerima</b>; mundur → sanksi. Pengganti urutan berikutnya: negosiasi, disetujui Pejabat Berwenang, masa penawaran masih berlaku.</li>\n    <li>Nilai total HPS/OE boleh dibuka saat penunjukan; rincian tetap rahasia.</li>\n    <li>Surat penunjukan &amp; semua BA jadi bagian tak terpisahkan dari kontrak. Kontrak ditandatangani <b>segera</b>.</li>\n  </ul>\n  <h2>SP3MK</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Dengan justifikasi Pejabat Berwenang FPP: <b>darurat</b> (emergency declare &amp; pemenang ditetapkan) atau <b>mendesak</b>.</li>\n    <li>Setelah penetapan pemenang dalam hal tertentu → perlu ijin prinsip pejabat satu tingkat di atasnya.</li>\n    <li>Segera diikuti kontrak; <b>tidak bisa jadi dasar penagihan</b>.</li>\n  </ul>\n  <h2>Hard copy dari SAPP</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Data &amp; approval di SAPP sah secara hukum (pengganti tanda tangan basah).</li>\n    <li><b>3 calon pemenang</b> menyerahkan surat penawaran cetak, bermeterai, cap, sampul tertutup; harga sama dengan submit terakhir. Rincian harga hanya untuk peringkat 1.</li>\n  </ul>"}, {"book": "tko", "sec": "07 · Gagal &amp; Ulang", "ref": "Bab III.C.33–34 · Lamp. 6", "kick": "Kalau tidak berhasil", "title": "Gagal, batal, ulang", "c": "--c:var(--red)", "html": "<div class=\"grid2\">\n    <div class=\"box r\"><b>Gagal</b>\n      <ul class=\"d\" style=\"margin-top:.24px;\"><li>Peserta kurang dari minimum</li><li>Tak ada penawaran sah</li><li>Harga tetap di atas HPS/OE (penyesuaian)</li><li>Proses tak sesuai prosedur</li><li>Tak ada calon bersedia ditunjuk</li><li>Sanggahan atas pemenang benar</li></ul></div>\n    <div class=\"box s\"><b>Batal</b> (oleh Pejabat Berwenang FPP)\n      <ul class=\"d\" style=\"margin-top:.24px;--c:var(--navy)\"><li>Rencana kerja/kebutuhan berubah</li><li>Anggaran tidak cukup</li><li>Penetapan pengadilan</li><li>Indikasi kuat KKN</li><li>Keadaan kahar</li></ul></div>\n  </div>\n  <p class=\"small\" style=\"margin:.24px 0\">Tabel minimum peserta &amp; pemilihan ulang (Lampiran 6). Syarat: tahap I–III = mendaftar, lulus kualifikasi, menawar; IV = lulus evaluasi.</p>\n  <table>\n    <tr><th>Kategori</th><th>Pertama</th><th>Ulang I</th><th>Ulang II</th></tr>\n    <tr><td><b>Terbatas · Kecil</b></td><td>≥1 di semua tahap</td><td>Domisili diperluas</td><td>Gol. kecil &amp; menengah, tanpa batas domisili</td></tr>\n    <tr><td><b>Terbatas · Menengah</b></td><td>I–III ≥2, IV ≥1</td><td>Syarat sama, ≥1</td><td>DPT &amp; non-DPT, gol. menengah &amp; besar</td></tr>\n    <tr><td><b>Terbatas · Besar ≤ Rp50 M</b></td><td>I–III ≥2, IV ≥1</td><td>Syarat sama, ≥1</td><td>Tender Terbuka gol. besar</td></tr>\n    <tr><td><b>Terbatas · Besar &gt; Rp50 M</b></td><td>I–III ≥2, IV ≥1</td><td>Tender Terbuka gol. besar</td><td>–</td></tr>\n    <tr><td><b>Terbuka · Besar</b></td><td>I–III ≥2, IV ≥1</td><td>Syarat sama, ≥1</td><td>–</td></tr>\n  </table>\n  <p class=\"small\">Metode 2 tahap: min. 2 peserta lulus tahap I. Ulang terakhir gagal → metode berikutnya (PL/Terbatas/Terbuka) diputuskan FPP bersama Procurement, disetujui Pejabat Berwenang FPP.</p>"}, {"book": "tko", "sec": "08 · Metode Lain", "ref": "Bab VII.A–G", "kick": "Apa bedanya", "title": "Metode lain vs Tender Terbuka", "c": "--c:var(--red)", "html": "<table>\n    <tr><th style=\"width:84px\">Metode</th><th>Perbedaan dari Tender Terbuka</th></tr>\n    <tr><td><b>Tender Terbatas</b></td><td>Undang semua DPT sesuai golongan, bidang &amp; CSMS lewat SAPP; <b>tanpa kualifikasi umum</b>. (Alur lengkap di halaman terakhir.)</td></tr>\n    <tr><td><b>Penunjukan Langsung</b></td><td>Tanpa pengumuman; tunjuk <b>1 DPT</b> yang sesuai. Usulan FPP belum DPT → registrasi dulu. <b>Tanpa masa sanggah.</b></td></tr>\n    <tr><td><b>Penunjukan Sinergi</b></td><td>Sama dengan Penunjukan Langsung.</td></tr>\n    <tr><td><b>Penugasan Sinergi</b></td><td>Oleh <b>FPP sendiri</b>; kajian teknis &amp; keekonomian diusulkan Pejabat Berwenang FPP, disetujui Direktur terkait.</td></tr>\n  </table>\n  <h2>Buyer Purchase <span class=\"tag n\" style=\"margin-left:4px\">Procurement</span></h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Maks. <b>Rp50 jt per paket</b>.</li>\n    <li><b>Cash Card</b>: beli tunai/cara lain tanpa kontrak, maks. Rp50 jt (atau ekuivalen USD).</li>\n    <li><b>Procurement Card</b>: maks. Rp50 jt per transaksi; dipegang pekerja Procurement berwenang; diterbitkan Bank BUMN/BUMD.</li>\n  </ul>\n  <h2>User Purchase <span class=\"tag g\" style=\"margin-left:4px\">FPP</span></h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Spesifikasi diketahui umum <b>dan</b> harga ter-publish, atau event organizer.</li>\n    <li>Bayar lewat <b>UMK</b> atau invoice; nilai sesuai otorisasi UMK/Pejabat Berwenang.</li>\n  </ul>"}, {"book": "tko", "sec": "08 · Swakelola", "ref": "Bab VII.H", "kick": "Dikerjakan sendiri", "title": "Prosedur swakelola", "c": "--c:var(--red)", "html": "<h2>Oleh FPP sendiri</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>FPP menyusun rencana kegiatan, jadwal &amp; <b>RAB</b> (termasuk barang/jasa pendukung); ditetapkan Pejabat Berwenang.</li>\n    <li>Tenaga lapangan boleh dibayar upah borongan. Barang/jasa pendukung diadakan Procurement sesuai STK; nilainya termasuk nilai swakelola.</li>\n    <li>Lapor kemajuan &amp; keuangan berkala; pertanggungjawaban ke <b>Fungsi Keuangan</b> tanpa lewat Procurement.</li>\n  </ul>\n  <h2>Oleh Pelaksana Kontrak Swakelola</h2>\n  <div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">1</div><div class=\"t\"><b>Tetapkan sasaran, lingkup, jadwal, HPS/OE <span class=\"who\">FPP</span></b><span>Setelah nota kesepahaman (bila ada); disahkan Pejabat Berwenang.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">2</div><div class=\"t\"><b>Pilih &amp; undang calon pelaksana <span class=\"who\">Pejabat Berwenang</span></b><span>Pertimbangkan kebijakan, aturan, kemampuan. Banyak alternatif → kontes/sayembara.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">3</div><div class=\"t\"><b>Calon menyatakan minat &amp; kirim proposal</b><span>FPP mengevaluasi, mengklarifikasi, menegosiasi.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">4</div><div class=\"t\"><b>Tunjuk 1 pelaksana &amp; tanda tangan</b><span>Surat kuasa/kontrak/perjanjian; pekerjaan utama tak boleh dialihkan.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--navy)\">5</div><div class=\"t\"><b>Lapor bulanan, awasi, serah terima <span class=\"who\">FPP</span></b><span>Bayar via UMK/invoice sesuai kontrak.</span></div></div>\n  </div>"}, {"book": "tko", "sec": "09 · Integritas", "ref": "Lampiran 2–5", "kick": "Komitmen tertulis", "title": "Pakta integritas & pernyataan", "c": "--c:var(--navy)", "html": "<h2>Pakta Integritas pekerja (termasuk FPP)</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Berpegang pada prinsip pengadaan, <b>Code of Conduct</b>, kompetisi adil &amp; transparan, serta GCG.</li>\n    <li><b>Tidak punya kepentingan pribadi</b> atau benturan kepentingan dalam keputusan.</li>\n    <li>Bertindak sesuai kewenangan, beritikad baik, mandiri, bebas tekanan.</li>\n    <li>Hati-hati (<i>duty of care</i>) dan patuh hukum; siap bertanggung jawab perdata maupun pidana.</li>\n  </ul>\n  <h2>Yang dinyatakan penyedia</h2>\n  <div class=\"grid2\">\n    <ul class=\"d\" style=\"--c:var(--navy)\"><li>Informasi benar; pemalsuan → sanksi <b>hitam</b></li><li>Harga wajar; bila tak wajar, kelebihan dikembalikan</li><li>Tidak ada benturan kepentingan</li><li>Tidak pailit/dalam pengawasan pengadilan</li><li>Pimpinan tidak sedang menjalani pidana</li></ul>\n    <ul class=\"d\" style=\"--c:var(--navy)\"><li>Tidak berperkara dengan grup Pertamina</li><li>Tidak terkena sanksi merah/hitam</li><li>Tidak punya hubungan istimewa dengan peserta lain</li><li>Siap diaudit kepatuhan anti-korupsi (FCPA/ABC)</li><li>Pimpinan &amp; pengurus bukan pegawai Pertamina Retail</li></ul>\n  </div>\n  <div class=\"key\"><b>Ingat:</b> Pakta Integritas ditandatangani setiap pekerja yang terlibat pengadaan, termasuk FPP. Pernyataan yang tidak benar bisa berujung <b>tanggung jawab perdata maupun pidana</b>.</div>"}, {"book": "tko", "sec": "09 · Dokumen", "ref": "Bab V", "kick": "Arsip lengkap", "title": "Checklist dokumen pemilihan", "c": "--c:var(--navy)", "html": "<table>\n    <tr><th>Tahap</th><th>Dokumen</th><th style=\"width:52px\">Oleh</th></tr>\n    <tr><td><b>Perencanaan</b></td><td>PPL; usulan di luar PPL &amp; risalah Procurement Committee (bila ada)</td><td>FPP</td></tr>\n    <tr><td><b>Permintaan</b></td><td>Memo permintaan, DP3, HPS/OE sah, PR, ijin prinsip (bila ada)</td><td>FPP</td></tr>\n    <tr><td><b>Persiapan</b></td><td>Risalah pra-tender, Dokumen Pemilihan, pengumuman/undangan, bidder list</td><td>Proc.</td></tr>\n    <tr><td><b>Kualifikasi</b></td><td>Hasil registrasi/update data, hasil kualifikasi khusus</td><td>Proc./FPP</td></tr>\n    <tr><td><b>Penjelasan</b></td><td>Risalah pre-bid/BA Penjelasan, amandemen Dokumen Tender</td><td>Proc.+FPP</td></tr>\n    <tr><td><b>Penawaran</b></td><td>BA Pembukaan, BA Evaluasi Administrasi, BA Klarifikasi</td><td>Proc.+FPP</td></tr>\n    <tr><td><b>Evaluasi</b></td><td>Hasil evaluasi teknis &amp; HSSE, BA Evaluasi Komersial</td><td>FPP/Proc.</td></tr>\n    <tr><td><b>Negosiasi</b></td><td>BA Hasil Negosiasi, BA Harga Timpang, penegasan harga</td><td>Proc.+FPP</td></tr>\n    <tr><td><b>Keputusan</b></td><td>BA Hasil Pemilihan, LHP, keputusan penetapan, pengumuman pemenang, jawaban sanggahan</td><td>Proc./PB</td></tr>\n    <tr><td><b>Kontrak</b></td><td>Surat Pemberitahuan Pemenang, SP3MK (bila ada), kontrak, PO, jaminan pelaksanaan</td><td>Proc./PB</td></tr>\n  </table>\n  <p class=\"small\">Proc. = Fungsi Procurement · PB = Pejabat Berwenang FPP. Procurement mengarsip seluruh dokumen, termasuk asli penawaran dan kontrak.</p>"}], "flow": "\n  \n  \n  <div class=\"lg\"><span><i style=\"background:var(--green)\"></i>FPP</span><span><i style=\"background:var(--blue)\"></i>Procurement</span><span><i style=\"background:#e3a008\"></i>Penyedia</span><span><i style=\"background:var(--navy)\"></i>Pejabat Berwenang</span><span><i class=\"dm\"></i>Keputusan</span></div>\n  <div class=\"cols\">\n    <div class=\"col\">\n      <div class=\"bx g\"><em>1</em><b>Permintaan + DP3</b>Memo, DP3, HPS/OE, PR (berdasarkan PPL)</div>\n      <div class=\"bx b\"><em>2</em><b>Persiapan</b>Review DP3, rapat pra-tender, Dokumen Pemilihan</div>\n      <div class=\"bx b\"><em>3</em><b>Undangan via SAPP</b>Semua DPT sesuai golongan, bidang &amp; CSMS (SKT aktif)</div>\n      <div class=\"bx y\"><em>4</em><b>Mendaftar</b>Kirim dokumen kualifikasi khusus</div>\n      <div class=\"bx bg\"><em>5</em><b>Kualifikasi khusus</b>Procurement + FPP · <u>tanpa kualifikasi umum</u></div>\n      <div class=\"dc\"><span>Peserta cukup? (Lamp. 6)</span><small>Tidak → gagal/ulang</small></div>\n      <div class=\"bx bg\"><em>6</em><b>Pre-bid &amp; tinjauan lokasi</b>Dokumen Tender ke yang lulus; BA Penjelasan + amandemen</div>\n      <div class=\"bx y\"><em>7</em><b>Kirim penawaran</b>Sesuai batas waktu</div>\n      <div class=\"bx bg\"><em>8</em><b>Pembukaan &amp; administrasi</b>BA Pembukaan hari itu juga</div>\n      <div class=\"cont\">lanjut ke langkah 9 →</div>\n    </div>\n    <div class=\"col\">\n      <div class=\"cont\">lanjutan dari langkah 8 ↓</div>\n      <div class=\"bx g\"><em>9</em><b>Evaluasi teknis &amp; HSSE</b>Oleh FPP; klarifikasi bila perlu</div>\n      <div class=\"bx b\"><em>10</em><b>Umumkan hasil teknis</b>Masa sanggah 1 HK</div>\n      <div class=\"bx bg\"><em>11</em><b>Komersial &amp; negosiasi</b>BA Negosiasi / Harga Timpang</div>\n      <div class=\"dc\"><span>Harga ≤ HPS/OE?</span><small>Tidak → sesuaikan HPS / gagal</small></div>\n      <div class=\"bx y\"><em>12</em><b>Penegasan harga</b>Penawar terbaik</div>\n      <div class=\"bx b\"><em>13</em><b>BA Hasil Pemilihan + LHP</b>Usul 1 calon (+2 cadangan)</div>\n      <div class=\"dc n\"><span>LHP disetujui? (≤ 7 HK)</span><small>Tidak → evaluasi ulang / lainnya</small></div>\n      <div class=\"bx b\"><em>14</em><b>Umumkan pemenang</b>Sanggah 3 HK · jawaban 5 HK</div>\n      <div class=\"dc\"><span>Sanggahan benar?</span><small>Ya → anulir; jaminan kembali</small></div>\n      <div class=\"bx bn\"><em>15</em><b>Penunjukan &amp; kontrak</b>Surat penunjukan, PO, tanda tangan, distribusi, jaminan pelaksanaan</div>\n    </div>\n  </div>\n", "reg": [{"book": "reg", "sec": "01 · Dasar", "ref": "Bab I–II, VIII", "kick": "Kenapa ada TKO ini", "title": "Tujuan & ruang lingkup", "c": "--c:var(--blue)", "html": "<h2>Tujuan</h2>\n  <ul class=\"d\"><li>Menyamakan pemahaman &amp; jadi acuan pelaku pengadaan dalam <b>Registrasi</b> dan <b>Update Data</b> penyedia.</li><li>Pelaksanaannya sesuai tujuan, kebijakan, prinsip, dan etika pengadaan.</li></ul>\n  <h2>Mencakup tiga kegiatan</h2>\n  <div class=\"grid3\">\n    <div class=\"chip\"><b>Registrasi Periodik</b><span>Min. 1× setahun, tanpa harus ada pemilihan</span></div>\n    <div class=\"chip\"><b>Update Data</b><span>Bagi penyedia yang sudah di DPT</span></div>\n    <div class=\"chip\"><b>Registrasi saat Pemilihan</b><span>Untuk calon peserta yang belum DPT</span></div>\n  </div>\n  <p style=\"margin-top:4.8px\">Berlaku di <b>Pertamina Retail dan Anak Perusahaan Pertamina Retail</b>.</p>\n  <h2>Ukuran keberhasilan</h2>\n  <ul class=\"d\"><li>Registrasi &amp; Update Data efektif, efisien, bertanggung jawab, dan hati-hati.</li><li>Ada pengendalian yang memadai atas seluruh kegiatan.</li></ul>\n  <div class=\"key\"><b>Inti untuk FPP:</b> penyedia yang lulus registrasi masuk <b>DPT</b> dan mendapat <b>SKT</b>. Status DPT/SKT menentukan siapa yang bisa Anda undang atau usulkan dalam pemilihan.</div>"}, {"book": "reg", "sec": "01 · Dasar", "ref": "Bab III.A", "kick": "Kamus singkat", "title": "Istilah penting", "c": "--c:var(--blue)", "html": "<div class=\"term\"><b>Registrasi</b><span>Penilaian kualifikasi umum &amp; persyaratan lain untuk menerbitkan SKT.</span></div>\n  <div class=\"term\"><b>DPT</b><span>Daftar Penyedia Teregistrasi: penyedia yang lulus registrasi, dibuktikan dengan SKT.</span></div>\n  <div class=\"term\"><b>SKT</b><span>Surat Keterangan Teregistrasi, diberikan bila lulus registrasi.</span></div>\n  <div class=\"term\"><b>Update Data</b><span>Pembaruan dokumen kedaluwarsa atau perubahan dokumen oleh penyedia DPT.</span></div>\n  <div class=\"term\"><b>PVD</b><span>Pertamina Vendor Database: data seluruh DPT &amp; non-DPT di ERP.</span></div>\n  <div class=\"term\"><b>Tim Registrasi</b><span>Tim pelaksana Registrasi Periodik, Registrasi saat pemilihan, dan Update Data.</span></div>\n  <div class=\"term\"><b>Sistem Registrasi</b><span>Aplikasi tempat registrasi &amp; update data dilakukan dan dipantau.</span></div>\n  <div class=\"term\"><b>Kualifikasi umum</b><span>Golongan Usaha, Bidang Usaha, dan Kualifikasi CSMS.</span></div>\n  <div class=\"term\"><b>KBUP</b><span>Kode Bidang Usaha Pertamina, pengelompokan bidang usaha penyedia.</span></div>\n  <div class=\"term\"><b>PAL</b><span>Pertamina Approved List: daftar barang/jasa standar yang jadi acuan pengadaan.</span></div>\n  <div class=\"term\" style=\"border:none\"><b>Sole Source</b><span>Satu-satunya sumber penyedia (pabrikan, agen tunggal, distributor tunggal).</span></div>"}, {"book": "reg", "sec": "01 · Batasan", "ref": "Bab III.B.1–9", "kick": "Aturan dasar", "title": "Batasan & Tim Registrasi", "c": "--c:var(--blue)", "html": "<ul class=\"d\">\n    <li>Terbuka untuk semua pelaku usaha: <b>perseorangan</b> maupun <b>badan usaha</b> (dalam negeri, nasional, asing).</li>\n    <li>Yang dinilai: <b>golongan usaha, bidang usaha, kualifikasi CSMS</b>.</li>\n    <li>Semua dilakukan lewat <b>Sistem Registrasi</b>; penyedia bisa memantau progresnya.</li>\n  </ul>\n  <table>\n    <tr><th>Kegiatan</th><th>Waktu pelaksanaan</th></tr>\n    <tr><td><b>Registrasi Periodik</b></td><td>Minimal <b>1× setahun</b>, tanpa harus ada pemilihan penyedia</td></tr>\n    <tr><td><b>Update Data</b> (di luar pemilihan)</td><td><b>Setiap saat</b> atas permintaan penyedia</td></tr>\n    <tr><td><b>Registrasi/Update saat pemilihan</b></td><td>Ikut tata waktu pemilihan; bersamaan dengan kualifikasi khusus</td></tr>\n  </table>\n  <h2>Tim Registrasi</h2>\n  <ul class=\"d\">\n    <li>Anggota: Fungsi <b>Procurement</b>, <b>Corporate Secretary &amp; Legal</b>, <b>Keuangan</b>, <b>HSSE</b>.</li>\n    <li><b>FPP bisa ikut</b> bila registrasi dilakukan dalam rangka pemilihan penyedia.</li>\n    <li>Diketuai pejabat Procurement yang terlibat langsung secara operasional.</li>\n    <li>Surat Perintah Tim Registrasi disahkan <b>Direktur Utama</b>.</li>\n  </ul>"}, {"book": "reg", "sec": "02 · Registrasi Periodik", "ref": "Bab VII.A · Lamp. 3", "kick": "Langkah demi langkah", "title": "Alur Registrasi Periodik", "c": "--c:var(--green)", "html": "<div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">1</div><div class=\"t\"><b>Umumkan pembukaan <span class=\"who\">Tim Registrasi</span></b><span>Lewat Sistem Registrasi (bisa juga papan pengumuman/media massa), berisi syarat dokumen &amp; batas waktu. · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:#e3a008\">2</div><div class=\"t\"><b>Kirim dokumen <span class=\"who\">Penyedia</span></b><span>Seluruh dokumen persyaratan lewat Sistem Registrasi sesuai jadwal. · SLA 3</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">3</div><div class=\"t\"><b>Evaluasi &amp; verifikasi <span class=\"who\">Tim Registrasi</span></b><span>Cek dokumen administrasi &amp; legalitas; bila perlu klarifikasi atau <b>periksa ke lokasi domisili</b>. · SLA 20</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">4</div><div class=\"t\"><b>Tetapkan lulus/tidak &amp; umumkan <span class=\"who\">Tim Registrasi</span></b><span>Hasil diumumkan lewat Sistem Registrasi (dan papan pengumuman bila perlu). · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">5</div><div class=\"t\"><b>Input ke PVD → masuk DPT <span class=\"who\">Tim Registrasi</span></b><span>Data penyedia yang lulus dimasukkan ke PVD. · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">6</div><div class=\"t\"><b>Cetak SKT <span class=\"who\">Penyedia</span></b><span>Lewat Sistem Registrasi, <b>sah tanpa tanda tangan</b> Ketua Tim. · SLA 1</span></div></div>\n  </div>\n  <p class=\"small\">Angka SLA sesuai kolom SLA di diagram alir Lampiran 3; satuannya tidak disebutkan dalam TKO.</p>"}, {"book": "reg", "sec": "02 · Hasil Registrasi", "ref": "Bab VII.A.5", "kick": "Isi data DPT", "title": "Hasil registrasi", "c": "--c:var(--green)", "html": "<div class=\"grid2\">\n    <div class=\"chip\"><b>1. Biodata penyedia</b><span>Identitas &amp; alamat lengkap</span></div>\n    <div class=\"chip\"><b>2. Bidang usaha</b><span>Dari izin usaha &amp; pengalaman; maks. <b>3 bidang</b> (kode KBUP)</span></div>\n    <div class=\"chip\"><b>3. Golongan usaha</b><span>Dari izin usaha (atau kekayaan bersih)</span></div>\n    <div class=\"chip\"><b>4. Kualifikasi CSMS</b><span>Tinggi / Menengah / Rendah</span></div>\n  </div>\n  <p class=\"small\" style=\"margin:.32px 0 4px\">Penyedia tidak memilih bidang usaha → Tim Registrasi memilihkan berdasarkan <b>pengalaman terbanyak</b>.</p>\n  <table>\n    <tr><th>Jenis pelaku usaha</th><th>Golongan usaha</th></tr>\n    <tr><td>Perseorangan</td><td>Perseorangan</td></tr>\n    <tr><td>Badan usaha barang, pelaksana konstruksi, jasa lainnya</td><td>Besar (B) / Menengah (M) / Kecil (K)</td></tr>\n    <tr><td>Badan usaha jasa konsultansi (konstruksi &amp; non-konstruksi)</td><td>N/A</td></tr>\n    <tr><td>Non pelaku usaha</td><td>N/A</td></tr>\n  </table>\n  <h2>Bila golongan tak bisa ditentukan dari izin usaha</h2>\n  <table>\n    <tr><th>Golongan</th><th>Kekayaan bersih (neraca)</th></tr>\n    <tr><td>Perseorangan</td><td>Tidak disyaratkan</td></tr>\n    <tr><td><b>Kecil (K)</b></td><td>s.d. Rp1 M</td></tr>\n    <tr><td><b>Menengah (M)</b></td><td>&gt; Rp1 M s.d. Rp10 M</td></tr>\n    <tr><td><b>Besar (B)</b></td><td>&gt; Rp10 M</td></tr>\n  </table>\n  <p class=\"small\">CSMS dinilai, di-upgrade, dan diperbarui sesuai STK CSMS; masa berlakunya juga mengikuti STK itu.</p>"}, {"book": "reg", "sec": "03 · Update Data", "ref": "Bab III.B.4, VII.B · Lamp. 4", "kick": "Data tetap berlaku", "title": "Update Data penyedia DPT", "c": "--c:var(--green)", "html": "<h2>Wajib dilakukan bila</h2>\n  <ul class=\"d\" style=\"--c:var(--green)\">\n    <li>Ada dokumen persyaratan registrasi yang <b>kedaluwarsa</b>; dan/atau</li>\n    <li>Ada <b>perubahan dokumen</b> yang berdampak pada data penyedia di PVD.</li>\n  </ul>\n  <div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:#e3a008\">1</div><div class=\"t\"><b>Ajukan Update Data <span class=\"who\">Penyedia</span></b><span>Lengkap dengan dokumen pendukung, lewat Sistem Registrasi. · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">2</div><div class=\"t\"><b>Evaluasi &amp; verifikasi <span class=\"who\">Tim Registrasi</span></b><span>Sama seperti registrasi, tapi <b>hanya atas dokumen kedaluwarsa/berubah</b>; bisa klarifikasi. · SLA 20</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">3</div><div class=\"t\"><b>Terima atau tolak <span class=\"who\">Tim Registrasi</span></b><span>Keputusan disampaikan lewat Sistem Registrasi. · SLA 1</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">4</div><div class=\"t\"><b>Perbarui data di PVD <span class=\"who\">Tim Registrasi</span></b><span>Bila permintaan diterima. · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">5</div><div class=\"t\"><b>Cetak ulang SKT <span class=\"who\">Penyedia</span></b><span>Tanpa tanda tangan Ketua Tim. · SLA 1</span></div></div>\n  </div>\n  <div class=\"key\"><b>Awas:</b> dokumen relevan yang kedaluwarsa membuat SKT <b>dibekukan sementara</b>. Tidak update 3 tahun → <b>dihapus dari DPT</b>. (Lihat bab SKT.)</div>"}, {"book": "reg", "sec": "04 · Saat Pemilihan", "ref": "Bab III.B.11", "kick": "Penyedia belum DPT?", "title": "Registrasi saat pemilihan", "c": "--c:var(--red)", "html": "<h2>Hanya boleh untuk metode</h2>\n  <div class=\"grid3\">\n    <div class=\"box r\" style=\"margin:0\"><b>Tender Terbuka</b></div>\n    <div class=\"box r\" style=\"margin:0\"><b>Tender Terbatas</b> antar penyedia dalam <b>PAL</b> yang belum DPT</div>\n    <div class=\"box r\" style=\"margin:0\"><b>Penunjukan Langsung</b> ke <b>sole source</b> yang belum DPT</div>\n  </div>\n  <h2>Status calon peserta yang bisa mendaftar</h2>\n  <ol class=\"n\" style=\"--c:var(--red)\">\n    <li>Sudah DPT, SKT <b>aktif</b>;</li>\n    <li>Sudah DPT, SKT <b>dibekukan sementara</b> (selain yang sedang menjalani sanksi Merah/Hitam);</li>\n    <li>Pernah DPT tapi SKT <b>dicabut</b> (selain yang dicabut selamanya);</li>\n    <li><b>Belum</b> DPT.</li>\n  </ol>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Bentuk <b>tunggal atau konsorsium</b> ditetapkan di pengumuman/undangan; statusnya dikonfirmasi saat menyerahkan dokumen kualifikasi.</li>\n    <li>Registrasi/update dilakukan <b>bersamaan</b> dengan kualifikasi khusus, mengikuti jadwal pemilihan.</li>\n  </ul>\n  <div class=\"key\"><b>Tips FPP:</b> mengusulkan PL ke penyedia yang belum DPT? Pastikan memang <b>sole source</b>; penyedia tetap harus diregistrasi dulu.</div>"}, {"book": "reg", "sec": "04 · Saat Pemilihan", "ref": "Bab VII.C · Lamp. 5", "kick": "Langkah demi langkah", "title": "Alur registrasi saat pemilihan", "c": "--c:var(--red)", "html": "<div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">1</div><div class=\"t\"><b>Pengumuman/undangan <span class=\"who\">Procurement</span></b><span>Pemilihan penyedia diumumkan. · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:#e3a008\">2</div><div class=\"t\"><b>Daftar &amp; kirim dokumen kualifikasi <span class=\"who\">Calon peserta</span></b><span>Syarat umum &amp; khusus ke Procurement sesuai jadwal. · SLA 3</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">3</div><div class=\"t\"><b>Minta evaluasi ke Tim Registrasi <span class=\"who\">Procurement</span></b><span>Dokumen registrasi/update di Sistem Registrasi. · SLA 1</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">4</div><div class=\"t\"><b>Evaluasi &amp; verifikasi <span class=\"who\">Tim Registrasi</span></b><span>Registrasi = aturan periodik; update = aturan update DPT. · SLA 20</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">5</div><div class=\"t\"><b>Klarifikasi / cek lokasi <span class=\"who\">Tim Registrasi</span></b><span>Waktu klarifikasi mempertimbangkan jadwal pemilihan. · SLA 2</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">6</div><div class=\"t\"><b>Terima hasil registrasi <span class=\"who\">Procurement</span></b><span>Dari Tim Registrasi. · SLA 1</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--red)\">7</div><div class=\"t\"><b>Putuskan lulus kualifikasi <span class=\"who\">Procurement</span></b><span>Hasil registrasi + kualifikasi khusus jadi dasar; yang lulus lanjut ke tahap pemilihan berikutnya. · SLA 1</span></div></div>\n  </div>\n  <p class=\"small\">SLA sesuai Lampiran 5; satuannya tidak disebutkan dalam TKO.</p>"}, {"book": "reg", "sec": "04 · Konsorsium", "ref": "Bab III.B.10–11", "kick": "Kasus khusus", "title": "Konsorsium & banyak lokasi", "c": "--c:var(--red)", "html": "<h2>Konsorsium saat pemilihan</h2>\n  <p style=\"margin-bottom:.32px\">Registrasi/update dilakukan ke <b>lead firm dan/atau seluruh anggota</b>:</p>\n  <table>\n    <tr><th style=\"width:72px\">Status</th><th style=\"width:72px\">Kegiatan</th><th>Hasil</th></tr>\n    <tr><td><b>Non-DPT</b></td><td>Registrasi</td><td>SKT untuk lead firm/anggota <b>+ SKT Konsorsium</b></td></tr>\n    <tr><td><b>DPT</b></td><td>Update Data</td><td><b>SKT Konsorsium</b></td></tr>\n  </table>\n  <div class=\"box s\"><b>SKT Konsorsium</b> berlaku sampai perjanjian konsorsium berakhir; bisa diperpanjang atas pertimbangan <b>FPP</b> bersama Procurement (dan fungsi terkait bila perlu).</div>\n  <h2>Penyedia dengan lebih dari satu lokasi kerja</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Dokumen registrasi mencakup informasi <b>kantor pusat dan kantor cabang</b>.</li>\n    <li>Bila lulus, hanya terbit <b>1 SKT</b> yang memuat kantor pusat &amp; cabang.</li>\n  </ul>\n  <h2>Dokumen terkait</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Pengumuman registrasi / pengumuman-undangan pemilihan</li>\n    <li>Memo permintaan registrasi dari Procurement ke Tim Registrasi</li>\n    <li>Dokumen penyedia di Sistem Registrasi, hasil registrasi, dan SKT</li>\n  </ul>"}, {"book": "reg", "sec": "05 · SKT", "ref": "Bab III.B.12", "kick": "Bukti terdaftar", "title": "Surat Keterangan Teregistrasi", "c": "--c:var(--navy)", "html": "<div class=\"grid2\">\n    <div class=\"box s\" style=\"margin:0\"><b>Sah tanpa tanda tangan</b><br>SKT dicetak penyedia sendiri dari Sistem Registrasi.</div>\n    <div class=\"box g\" style=\"margin:0\"><b>Tidak ada masa berlaku</b><br>Tapi bisa <b>dibekukan</b> atau <b>dicabut</b>.</div>\n  </div>\n  <h2>Isi SKT</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Nomor &amp; biodata penyedia</li>\n    <li>Kualifikasi umum: <b>golongan usaha, bidang usaha, kualifikasi CSMS</b></li>\n    <li><b>Kinerja</b> penyedia dalam DPT</li>\n  </ul>\n  <h2>Cara FPP memakai SKT</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Cocokkan <b>bidang usaha</b> dan <b>golongan usaha</b> dengan pekerjaan &amp; nilainya.</li>\n    <li>Cocokkan <b>kualifikasi CSMS</b> dengan tingkat risiko HSSE di DP3.</li>\n    <li>Pastikan status SKT <b>aktif</b>: undangan Tender Terbatas hanya ke DPT yang SKT-nya tidak dibekukan.</li>\n    <li>Lihat <b>kinerja</b> (poin &amp; kategori Hijau/Kuning/Merah/Hitam) — lihat Buku Saku Seri 4.</li>\n  </ul>\n  <div class=\"key\"><b>Ingat:</b> SKT yang dibekukan karena sanksi <b>Merah/Hitam</b> tidak bisa diaktifkan sebelum masa sanksinya selesai.</div>"}, {"book": "reg", "sec": "05 · Status SKT", "ref": "Bab III.B.12 (3)", "kick": "Kapan SKT tidak aktif", "title": "Pembekuan & pencabutan", "c": "--c:var(--navy)", "html": "<table>\n    <tr><th style=\"width:12px\">#</th><th>Kondisi</th><th style=\"width:60px\">Status</th><th>Syarat aktif kembali</th></tr>\n    <tr><td>1</td><td>Dokumen yang relevan dengan pekerjaan <b>kedaluwarsa</b></td><td><span class=\"tag\" style=\"background:#e3a008\">Beku sementara</span></td><td>Serahkan perpanjangan dokumen</td></tr>\n    <tr><td>2</td><td>Masuk kategori <b>Merah/Hitam</b></td><td><span class=\"tag\" style=\"background:#e3a008\">Beku sementara</span></td><td>Masa sanksi berakhir</td></tr>\n    <tr><td>3</td><td><b>Tidak pernah ikut pemilihan 3 tahun</b> berturut-turut</td><td><span class=\"tag\" style=\"background:#e3a008\">Beku sementara</span></td><td>Surat permohonan pengaktifan + update data (bila ada)</td></tr>\n    <tr><td>4</td><td><b>Tidak update data 3 tahun</b> sejak dokumen kedaluwarsa, dan/atau tidak minta pengaktifan &gt; 3 tahun sejak dibekukan</td><td><span class=\"tag r\">Dihapus dari DPT, SKT dicabut</span></td><td>Surat permohonan + <b>registrasi ulang</b> seluruh dokumen</td></tr>\n    <tr><td>5</td><td>Sudah jalani sanksi 2 tahun &amp; dalam <b>masa percobaan 1 tahun</b> lalu melakukan <b>Fraud</b> lagi</td><td><span class=\"tag\" style=\"background:#111\">Dicabut selamanya</span></td><td><b>Tidak bisa</b> registrasi ulang/ikut pemilihan di Pertamina Grup (non-cost recovery)</td></tr>\n  </table>\n  <div class=\"key\"><b>3 tahun</b> adalah angka kunci: tidak ikut pemilihan → beku; tidak update/tidak minta aktif → dicabut.</div>"}, {"book": "reg", "sec": "06 · Persyaratan", "ref": "Lampiran 1", "kick": "Badan usaha dalam negeri/nasional", "title": "Administrasi & legalitas", "c": "--c:var(--navy)", "html": "<ol class=\"n\" style=\"--c:var(--navy)\">\n    <li>Surat permintaan registrasi</li>\n    <li>Biodata penyedia (alamat lengkap + kode pos, telepon, fax, e-mail)</li>\n    <li>Surat keterangan domisili dari instansi berwenang</li>\n    <li><b>Pakta Integritas</b></li>\n    <li>Surat pernyataan <b>bermeterai</b>: semua informasi benar; bila tidak sesuai siap disanksi</li>\n    <li>Surat izin tempat usaha / keterangan domisili perusahaan, atau <b>NIB</b></li>\n    <li>Tanda Daftar Perusahaan (TDP) atau <b>NIB</b></li>\n    <li>Akta pendirian/anggaran dasar &amp; perubahannya, disahkan: Kemenkumham (PT), Pengadilan Negeri (CV), Kementerian Koperasi (koperasi)</li>\n    <li>Susunan pengurus &amp; data personal pengurus</li>\n    <li>Kartu tanda pengenal pengurus</li>\n  </ol>"}, {"book": "reg", "sec": "06 · Persyaratan", "ref": "Lampiran 1", "kick": "Penentuan kualifikasi umum", "title": "Izin usaha & pengalaman", "c": "--c:var(--navy)", "html": "<table>\n    <tr><th>Jenis usaha</th><th>Izin usaha (acuan)</th></tr>\n    <tr><td>Pengadaan barang</td><td>SIUP atau Izin Usaha Industri (IUI)</td></tr>\n    <tr><td>Jasa lainnya</td><td>SIUP atau Izin Usaha Tetap (IUT) usaha jasa</td></tr>\n    <tr><td>Konstruksi &amp; konsultansi konstruksi</td><td>SIUJK</td></tr>\n    <tr><td>Konsultansi non-konstruksi</td><td>SIUP usaha jasa konsultansi</td></tr>\n    <tr><td>Angkutan laut</td><td>SIUPAL</td></tr>\n    <tr><td>Salvage / pekerjaan bawah air</td><td>Izin usaha salvage/pekerjaan bawah air</td></tr>\n    <tr><td>Keagenan &amp; distributor</td><td>Surat Tanda Pendaftaran (STP)</td></tr>\n    <tr><td>Penyedia tenaga kerja</td><td>Izin operasional dari Disnaker; penyedia TKJP harus <b>PT</b></td></tr>\n  </table>\n  <p class=\"small\">Daftar ini acuan awal; izin bisa bertambah/berbeda sesuai peraturan yang berlaku.</p>\n  <h2>Dokumen kualifikasi lain</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Permohonan bidang usaha, <b>maks. 3</b></li>\n    <li>Data <b>pengalaman kerja 3 tahun terakhir</b></li>\n    <li>Surat penunjukan agen/distributor (tunggal) bila ada</li>\n    <li>Status sebagai anak/afiliasi Pertamina atau BUMN (bila ada)</li>\n  </ul>"}, {"book": "reg", "sec": "06 · Persyaratan", "ref": "Lampiran 1", "kick": "Aspek keuangan & CSMS", "title": "Dokumen keuangan", "c": "--c:var(--navy)", "html": "<ol class=\"n\" style=\"--c:var(--navy)\">\n    <li>Susunan kepemilikan modal</li>\n    <li>NPWP</li>\n    <li>Surat Pengukuhan Pengusaha Kena Pajak (SPPKP)</li>\n    <li>Referensi bank &amp; nomor rekening</li>\n    <li>Neraca perusahaan — bila golongan usaha <b>tidak bisa ditentukan dari izin usaha</b></li>\n  </ol>\n  <table>\n    <tr><th style=\"width:96px\">Golongan</th><th>Neraca yang diminta</th></tr>\n    <tr><td><b>Menengah &amp; Besar</b></td><td><b>1 tahun terakhir, audit KAP</b>, opini wajar tanpa pengecualian (termasuk dengan paragraf penjelasan) atau wajar dengan pengecualian</td></tr>\n    <tr><td><b>Kecil</b></td><td>Neraca <b>3 tahun terakhir</b></td></tr>\n  </table>\n  <p class=\"small\">Neraca audit KAP tahun sebelumnya dianggap sudah bisa tersedia mulai <b>1 April</b> tahun berjalan.</p>\n  <h2>Persyaratan CSMS</h2>\n  <p>Mengacu STK Contractor Safety Management System (CSMS). Hasilnya: <b>Tinggi, Menengah, atau Rendah</b>.</p>"}, {"book": "reg", "sec": "06 · Persyaratan", "ref": "Lampiran 1", "kick": "Kasus lain", "title": "Perusahaan asing & perseorangan", "c": "--c:var(--navy)", "html": "<h2>Perusahaan asing (19 dokumen)</h2>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Dokumen hukum dari pemerintah negara asal wajib <b>dilegalisasi</b> Kementerian Kehakiman/Luar Negeri negara itu <b>dan</b> perwakilan RI.</li>\n    <li>Dokumen bukan bahasa Inggris → <b>terjemahan penerjemah tersumpah</b>.</li>\n    <li>Antara lain: surat permohonan, pernyataan &amp; <i>letter of undertaking</i> dari CEO, Pakta Integritas, struktur organisasi, registrasi &amp; izin usaha, domisili, akta, identitas pengurus, dokumen pajak, referensi bank, pengalaman 3 tahun + kontrak/BAST, daftar peralatan, sertifikat CSMS, izin perwakilan.</li>\n    <li>Maks. 3 sub-bidang; SKT dicetak tanpa tanda tangan; Tim boleh minta dokumen asli.</li>\n  </ul>\n  <h2>Penyedia perseorangan (10 dokumen)</h2>\n  <div class=\"grid2\">\n    <ul class=\"d\" style=\"--c:var(--navy)\"><li>Surat permintaan registrasi</li><li>Biodata</li><li>CV + pengalaman 3 tahun</li><li>Ijazah dilegalisir</li><li>Sertifikat keahlian (bila ada)</li></ul>\n    <ul class=\"d\" style=\"--c:var(--navy)\"><li>Kartu identitas</li><li>NPWP</li><li>Bukti bayar pajak terakhir</li><li>Referensi bank</li><li>Permohonan maks. 3 bidang usaha</li></ul>\n  </div>"}, {"book": "reg", "sec": "07 · KBUP", "ref": "Lampiran 2", "kick": "Kode bidang usaha", "title": "Kelompok KBUP", "c": "--c:var(--blue)", "html": "<table>\n    <tr><th style=\"width:44px\">Kode</th><th>Kelompok &amp; contoh sub bidang</th></tr>\n    <tr><td><span class=\"tag\">P</span></td><td><b>Pengadaan barang</b>: P01 eksplorasi/produksi/pengolahan · P02 konstruksi, mekanikal &amp; elektrikal · P03 bahan kimia &amp; peledak · P04 kantor, pergudangan, kesehatan, rumah tangga</td></tr>\n    <tr><td><span class=\"tag g\">Q01–07</span></td><td><b>Jasa perencana konstruksi</b>: arsitektur, sipil, mekanikal, elektrikal, tata lingkungan, survei, analisis &amp; enjiniring</td></tr>\n    <tr><td><span class=\"tag g\">Q11–15</span></td><td><b>Jasa pelaksana konstruksi</b>: arsitektur (termasuk perawatan gedung), sipil, mekanikal, elektrikal, tata lingkungan</td></tr>\n    <tr><td><span class=\"tag g\">Q21–23</span></td><td><b>Jasa pengawas konstruksi</b>: inspeksi teknis, manajemen proyek, enjiniring terpadu</td></tr>\n    <tr><td><span class=\"tag r\">R</span></td><td><b>Jasa lainnya</b>: R01 logam, kayu, plastik · R02 pertanian–kehutanan · R03 pertambangan umum · R04 pertambangan migas · R05 telematika · R06 real estate · R07 jasa lain-lain</td></tr>\n    <tr><td><span class=\"tag n\">S</span></td><td><b>Konsultansi non-konstruksi</b>: S01 pariwisata/pos/telekomunikasi · S02 pertanian · S03 perindustrian · S04 pembangkitan tenaga · S05 lingkup layanan (survei, studi kelayakan, penelitian, pengawasan, manajemen) · S06 lain-lain (keuangan, SDM, hukum)</td></tr>\n  </table>\n  <div class=\"key\"><b>Tips FPP:</b> sebut bidang usaha (kode KBUP) yang tepat di DP3, karena undangan Tender Terbatas dikirim ke DPT dengan bidang usaha yang sesuai.</div>"}], "pen": [{"book": "pen", "sec": "01 · Dasar", "ref": "Bab I–II, VIII", "kick": "Kenapa ada TKO ini", "title": "Tujuan & ruang lingkup", "c": "--c:var(--blue)", "html": "<h2>Tujuan</h2>\n  <ul class=\"d\"><li>Menyamakan pemahaman &amp; jadi acuan dalam <b>Penilaian Kinerja</b> dan <b>Koreksi Sanksi</b> penyedia.</li><li>Pelaksanaannya sesuai tujuan, kebijakan, prinsip, dan etika pengadaan.</li></ul>\n  <h2>Berlaku untuk pengadaan lewat</h2>\n  <div class=\"grid2\">\n    <div class=\"box s\" style=\"margin:0\"><b>Sinergi Pertamina Incorporated</b><br>Mekanisme Penunjukan ke Anak Perusahaan/Afiliasi Pertamina</div>\n    <div class=\"box s\" style=\"margin:0\"><b>Tender</b><br>Selain Pengadaan Langsung (Direct Purchase)</div>\n  </div>\n  <p style=\"margin-top:4.8px\">Berlaku di lingkungan <b>Pertamina Retail</b>.</p>\n  <h2>Ukuran keberhasilan</h2>\n  <ul class=\"d\"><li>Penilaian kinerja &amp; koreksi sanksi efektif, efisien, bertanggung jawab, dan hati-hati.</li><li>Pengendalian memadai oleh semua pihak sesuai kewenangannya.</li><li>Semua kinerja, pelanggaran, dan sanksi <b>tercatat di sistem</b> dan terpantau.</li></ul>\n  <div class=\"key\"><b>Inti untuk FPP:</b> kinerja penyedia terekam di <b>PVD</b> dan tampil di SKT. Penilaian yang Anda berikan saat kontrak berjalan ikut menentukan apakah penyedia bisa ikut pengadaan berikutnya.</div>"}, {"book": "pen", "sec": "01 · Dasar", "ref": "Bab III.A", "kick": "Kamus singkat", "title": "Istilah penting", "c": "--c:var(--blue)", "html": "<div class=\"term\"><b>Penilaian Kinerja</b><span>Menilai kinerja penyedia, baik prestasi maupun pelanggaran.</span></div>\n  <div class=\"term\"><b>Penghargaan</b><span>Tambahan poin kinerja (+) sesuai jenis prestasi.</span></div>\n  <div class=\"term\"><b>Sanksi</b><span>Poin sanksi (−) atau penggolongan ke kelompok tertentu karena pelanggaran.</span></div>\n  <div class=\"term\"><b>Tabel Penilaian Kinerja</b><span>Acuan jenis prestasi/pelanggaran dan poinnya (Lampiran 2).</span></div>\n  <div class=\"term\"><b>Komite Sanksi</b><span>Komite ad-hoc (Procurement, FPP, Hukum, fungsi terkait) untuk kasus sanksi tertentu.</span></div>\n  <div class=\"term\"><b>Koreksi Sanksi</b><span>Peninjauan sanksi karena ada bukti baru yang diduga kuat bisa menganulirnya.</span></div>\n  <div class=\"term\"><b>Fraud</b><span>Penyimpangan disengaja oleh penyedia (sendiri/bersama pihak lain) yang merugikan Pertamina Retail.</span></div>\n  <div class=\"term\"><b>PVD</b><span>Pertamina Vendor Database; tempat hasil penilaian &amp; sanksi tercatat.</span></div>\n  <div class=\"term\"><b>GR / SA</b><span>Goods Receipt (barang) / Service Acceptance (jasa) di ERP; saat penilaian otomatis.</span></div>\n  <div class=\"term\" style=\"border:none\"><b>Fatality</b><span>Kecelakaan kerja yang menyebabkan korban meninggal dunia.</span></div>"}, {"book": "pen", "sec": "01 · Pelaksana", "ref": "Bab III.B.1–2 · Lamp. 1", "kick": "Kapan & oleh siapa", "title": "Pelaksana penilaian", "c": "--c:var(--blue)", "html": "<table>\n    <tr><th style=\"width:84px\">Tahap</th><th>Penanggung jawab</th><th style=\"width:100px\">Cara input</th></tr>\n    <tr><td><b>Registrasi / Update Data</b></td><td>Tim Registrasi; atau Komite Sanksi*</td><td>Manual di ERP</td></tr>\n    <tr><td><b>Pemilihan Penyedia</b></td><td>Tim Registrasi (kualifikasi umum); Procurement/Tim Tender/Pokja; atau Komite Sanksi*</td><td>Otomatis bila lewat SAPP; manual bila tidak</td></tr>\n    <tr><td><b>Pelaksanaan Kontrak</b></td><td><b>FPP</b> (termasuk amandemen); atau Komite Sanksi*</td><td>Otomatis saat <b>final SA/GR</b> di ERP; atau manual di ERP</td></tr>\n    <tr><td><b>Setelah kontrak berakhir</b> (pelanggaran baru diketahui)</td><td>Komite Sanksi</td><td>Manual di ERP</td></tr>\n  </table>\n  <p class=\"small\">* Untuk kondisi tertentu sesuai STK pengadaan sehingga perlu Rapat Komite Sanksi.</p>\n  <h2>Mekanisme penilaian (Bab VII.A)</h2>\n  <ul class=\"d\">\n    <li><b>Manual</b>: memilih jenis poin kinerja yang tersedia di sistem; atau</li>\n    <li><b>Otomatis</b>: sistem menghitung poin sendiri tanpa input manual.</li>\n  </ul>"}, {"book": "pen", "sec": "01 · Ketentuan", "ref": "Bab III.B.3, 6, 8", "kick": "Aturan main", "title": "Ketentuan umum penilaian", "c": "--c:var(--blue)", "html": "<ol class=\"n\">\n    <li>Berlaku untuk penyedia <b>tunggal maupun konsorsium</b>. Konsorsium: dinilai lead firm, seluruh anggota, <b>dan</b> konsorsiumnya.</li>\n    <li>Pelanggaran karena kelalaian <b>subkontraktor</b> jadi tanggung jawab pelaksana kontrak; sanksi dikenakan ke pelaksana kontrak.</li>\n    <li>Pada prinsipnya mengacu <b>Tabel Penilaian Kinerja</b>; kondisi tertentu diputus Komite Sanksi.</li>\n    <li>Harus berdasarkan <b>bukti yang dapat dipertanggungjawabkan</b>; boleh meminta penjelasan FPP, fungsi terkait, penyedia, dll.</li>\n    <li>Ketentuan penilaian &amp; koreksi sanksi wajib <b>disosialisasikan</b> ke penyedia dan <b>dicantumkan di rancangan kontrak</b> (bagian Dokumen Tender).</li>\n    <li>Hasilnya tercermin di <b>PVD</b>.</li>\n  </ol>\n  <h2>Info pelanggaran dari fungsi lain</h2>\n  <p>Fungsi terkait (HSSE, Keuangan, Hukum, <b>FPP</b>, dll.) yang tahu ada pelanggaran penyedia dapat memberi tahu Tim Registrasi/Procurement/FPP untuk ditindaklanjuti sesuai kewenangan.</p>\n  <div class=\"box s\"><b>Isi pemberitahuan pelanggaran:</b> identitas penyedia, nama paket, penjelasan pelanggaran, BA pemeriksaan (bila ada), dan bukti lain (surat pemutusan kontrak, foto, rekaman, konfirmasi pihak berwenang).</div>"}, {"book": "pen", "sec": "02 · Sistem Poin", "ref": "Bab III.B.4 · Lamp. 3", "kick": "Cara menghitung", "title": "Poin & kategori kinerja", "c": "--c:var(--green)", "html": "<div class=\"grid3\">\n    <div class=\"box g\" style=\"margin:0\"><span class=\"big\" style=\"color:var(--green)\">0</span><br>Poin awal saat penyedia teregistrasi &amp; dapat SKT</div>\n    <div class=\"box s\" style=\"margin:0\"><span class=\"big\" style=\"color:var(--blue)\">1 thn</span><br>Masa berlaku poin sejak tanggal dinilai</div>\n    <div class=\"box s\" style=\"margin:0\"><span class=\"big\" style=\"color:var(--navy)\">Σ</span><br>Poin bersifat <b>kumulatif</b></div>\n  </div>\n  <table style=\"margin-top:6.4px\">\n    <tr><th style=\"width:60px\">Kategori</th><th style=\"width:64px\">Poin</th><th>Akibat</th></tr>\n    <tr><td><span class=\"tag g\">HIJAU</span></td><td><b>≥ −30</b></td><td>Boleh ikut pemilihan di Pertamina Grup (selain cost recovery)</td></tr>\n    <tr><td><span class=\"tag\" style=\"background:#e3a008\">KUNING</span></td><td><b>−30 &gt; x ≥ −90</b></td><td>Boleh ikut pemilihan di Pertamina Grup (selain cost recovery)</td></tr>\n    <tr><td><span class=\"tag r\">MERAH</span></td><td><b>&lt; −90</b></td><td><b>Dilarang</b> ikut pengadaan <b>1 tahun</b> sejak sanksi masuk sistem</td></tr>\n    <tr><td><span class=\"tag\" style=\"background:#111\">HITAM</span></td><td>Langsung (jenis pelanggaran)</td><td><b>Dilarang 2 tahun</b> + <b>masa percobaan 1 tahun</b> (berlaku juga bagi pemilik/pengurus). Fraud lagi di masa percobaan → <b>SKT dicabut selamanya</b> di Pertamina Grup</td></tr>\n  </table>\n  <div class=\"key\"><b>Contoh:</b> mundur setelah ditunjuk pemenang (−60) lalu terlambat serahkan jaminan (−30) = −90 → <b>Kuning</b>. Satu pelanggaran −5 lagi dalam setahun → −95 → <b>Merah</b>.</div>"}, {"book": "pen", "sec": "03 · Tabel Kinerja", "ref": "Lamp. 2 · I", "kick": "Tahap pemilihan penyedia", "title": "Prestasi & pelanggaran (1)", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:16px\">#</th><th>Prestasi / pelanggaran</th><th style=\"width:40px\">Poin</th></tr>\n    <tr><td>1</td><td>Lulus penilaian kualifikasi umum &amp; khusus*</td><td><b style=\"color:var(--green)\">+3</b></td></tr>\n    <tr><td>2</td><td>Penawaran lengkap, lulus evaluasi administrasi*</td><td><b style=\"color:var(--green)\">+3</b></td></tr>\n    <tr><td>3</td><td>Lulus evaluasi teknis &amp; HSSE Plan*</td><td><b style=\"color:var(--green)\">+3</b></td></tr>\n    <tr><td>4</td><td>Lulus evaluasi komersial*</td><td><b style=\"color:var(--green)\">+3</b></td></tr>\n    <tr><td>5</td><td>Ditunjuk pelaksana kontrak &amp; sudah tanda tangan kontrak</td><td><b style=\"color:var(--green)\">+10</b></td></tr>\n    <tr><td>6</td><td>Mendaftar tapi tidak kirim dokumen kualifikasi/penawaran, <b>dengan</b> keterangan tertulis</td><td><b style=\"color:var(--red)\">−10</b></td></tr>\n    <tr><td>7</td><td>Terlambat kirim dokumen kualifikasi/penawaran sehingga tak diterima</td><td><b style=\"color:var(--red)\">−10</b></td></tr>\n    <tr><td>8</td><td>Mendaftar tapi tidak kirim dokumen, <b>tanpa</b> keterangan tertulis</td><td><b style=\"color:var(--red)\">−20</b></td></tr>\n    <tr><td>9</td><td>Tidak hadir pembukaan penawaran (bila diwajibkan Dokumen Tender)</td><td><b style=\"color:var(--red)\">−10</b></td></tr>\n    <tr><td>10</td><td>Tidak hadir rapat pemilihan (pre-bid, klarifikasi, negosiasi) <b>tanpa</b> penjelasan yang diterima**</td><td><b style=\"color:var(--red)\">−15</b></td></tr>\n    <tr><td>11</td><td>Tidak hadir rapat pemilihan <b>dengan</b> penjelasan tertulis yang diterima</td><td><b style=\"color:var(--red)\">−5</b></td></tr>\n  </table>\n  <p class=\"small\">* Hanya untuk Tender Terbuka &amp; Tender Terbatas. ** Sanksi tidak hadir pre-bid hanya bila kewajibannya diatur tegas di Dokumen Tender.</p>"}, {"book": "pen", "sec": "03 · Tabel Kinerja", "ref": "Lamp. 2 · I", "kick": "Tahap pemilihan penyedia", "title": "Pelanggaran (2)", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:16px\">#</th><th>Pelanggaran</th><th style=\"width:40px\">Poin</th></tr>\n    <tr><td>12</td><td>Tidak memberi penjelasan/tanggapan tertulis pada waktu yang ditetapkan Procurement</td><td><b style=\"color:var(--red)\">−10</b></td></tr>\n    <tr><td>13</td><td>Terlambat hadir negosiasi manual</td><td><b style=\"color:var(--red)\">−5</b></td></tr>\n    <tr><td>14</td><td>Terlambat kirim dokumen penegasan penawaran setelah negosiasi (dan rinciannya)</td><td><b style=\"color:var(--red)\">−10</b></td></tr>\n    <tr><td>15</td><td>Terlambat tanda tangan kontrak sesuai jadwal tanpa pemberitahuan tertulis yang diterima</td><td><b style=\"color:var(--red)\">−15</b></td></tr>\n    <tr><td>16</td><td>Mengajukan <b>sanggahan yang terbukti tidak benar</b></td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>17</td><td>Peserta <b>membatalkan penawaran</b></td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>18</td><td>Calon pemenang membatalkan penawaran <b>sebelum</b> penunjukan pemenang</td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>19</td><td>Pemenang membatalkan penawaran <b>setelah ditunjuk</b></td><td><b style=\"color:var(--red)\">−60</b></td></tr>\n  </table>\n  <div class=\"key\"><b>Perhatikan:</b> pemenang yang mundur setelah ditunjuk langsung kena <b>−60</b>, lebih dari separuh jalan ke kategori Merah (&lt; −90).</div>"}, {"book": "pen", "sec": "03 · Tabel Kinerja", "ref": "Lamp. 2 · II", "kick": "Tugas FPP", "title": "Tahap pelaksanaan pekerjaan (1)", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:16px\">#</th><th>Prestasi / pelanggaran</th><th style=\"width:40px\">Poin</th></tr>\n    <tr><td>1</td><td>Spesifikasi &amp; <b>delivery time sesuai kontrak</b></td><td><b style=\"color:var(--green)\">+5</b></td></tr>\n    <tr><td>2</td><td>Final evaluation HSSE Plan <b>≥ 90%</b></td><td><b style=\"color:var(--green)\">+10</b></td></tr>\n    <tr><td>3</td><td>Final evaluation HSSE Plan <b>&lt; 90%</b></td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>4</td><td>Terlambat selesai, <b>belum</b> mencapai denda maksimal</td><td><b style=\"color:var(--red)\">−15</b></td></tr>\n    <tr><td>5</td><td>Terlambat serahkan jaminan pengadaan (bila disyaratkan)</td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>6</td><td>Terlambat menyesuaikan jaminan saat ada perubahan kontrak</td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>7</td><td>Terlambat selesai <b>dan sudah</b> mencapai denda maksimal</td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n    <tr><td>8</td><td>Performance tidak sesuai kontrak, tapi FPP masih mentolerir</td><td><b style=\"color:var(--red)\">−30</b></td></tr>\n  </table>\n  <h2>Kapan dinilai (butir 1, 4, 7)</h2>\n  <div class=\"grid2\">\n    <div class=\"box s\" style=\"margin:0\"><b>Barang</b><br>Saat <b>Goods Receipt (GR)</b>. Partial delivery/COO yang tidak saling terkait: tiap GR partial &amp; final GR.</div>\n    <div class=\"box s\" style=\"margin:0\"><b>Jasa</b><br>Saat <b>Service Acceptance (SA) final</b>.</div>\n  </div>\n  <p class=\"small\">e-Purchasing: dinilai setiap COO ke pelaksana OA Catalog atau setiap order ke pelaksana e-Catalog.</p>"}, {"book": "pen", "sec": "03 · Tabel Kinerja", "ref": "Lamp. 2 · II", "kick": "Tugas FPP", "title": "Tahap pelaksanaan pekerjaan (2)", "c": "--c:var(--green)", "html": "<table>\n    <tr><th style=\"width:16px\">#</th><th>Pelanggaran</th><th style=\"width:40px\">Poin</th></tr>\n    <tr><td>9</td><td>Terbukti (investigasi) menyebabkan kecelakaan kerja dengan dampak salah satu:\n      <ul class=\"d\" style=\"margin-top:.24px\"><li>Cedera butuh penanganan <b>melebihi P3K</b> (medical treatment, restricted work/transfer)</li><li>Tumpahan minyak <b>1 ≤ x &lt; 5 Bbls</b></li><li>Kerusakan properti <b>USD 10.000 ≤ x &lt; 100.000</b></li></ul></td><td><b style=\"color:var(--red)\">−45</b></td></tr>\n    <tr><td>10</td><td>Tidak menyelesaikan pekerjaan sebagian/seluruhnya</td><td><b style=\"color:var(--red)\">−60</b></td></tr>\n    <tr><td>11</td><td>Tidak melaksanakan pemeliharaan selama masa pemeliharaan</td><td><b style=\"color:var(--red)\">−60</b></td></tr>\n    <tr><td>12</td><td>Tidak melaksanakan layanan purna jual di masa garansi</td><td><b style=\"color:var(--red)\">−60</b></td></tr>\n    <tr><td>13</td><td>Terbukti menyebabkan kecelakaan kerja dengan dampak salah satu:\n      <ul class=\"d\" style=\"margin-top:.24px\"><li>Cedera kategori <b>hari kerja hilang</b> (day away from work)</li><li>Tumpahan minyak <b>5 ≤ x &lt; 15 Bbls</b></li><li>Kerusakan properti <b>USD 100.000 ≤ x &lt; 1.000.000</b></li></ul></td><td><b style=\"color:var(--red)\">−60</b></td></tr>\n  </table>\n  <div class=\"key\"><b>Lebih berat dari ini</b> (fatality, kebakaran/kerugian ≥ USD 1 juta, tumpahan &gt; 15 Bbl) → langsung <b>Hitam</b>. Lihat halaman berikut.</div>"}, {"book": "pen", "sec": "03 · Tabel Kinerja", "ref": "Lamp. 2 · III", "kick": "Tanpa hitung poin", "title": "Langsung Merah / Hitam", "c": "--c:var(--red)", "html": "<table>\n    <tr><th style=\"width:16px\">#</th><th>Pelanggaran</th><th style=\"width:44px\">Sanksi</th></tr>\n    <tr><td>1</td><td>Sedang bersengketa dengan Pertamina Grup (non-cost recovery) di pengadilan/arbitrase/mediasi</td><td><span class=\"tag r\">Merah</span></td></tr>\n    <tr><td>2</td><td>Pengurus/pemilik modal/pemegang saham pelaksana kontrak jadi <b>tersangka</b> tindak pidana terkait pekerjaannya</td><td><span class=\"tag r\">Merah</span></td></tr>\n    <tr><td>3</td><td>Mempekerjakan pekerja Pertamina (kecuali diatur lain)</td><td><span class=\"tag r\">Merah</span></td></tr>\n    <tr><td>4</td><td>Mengalihkan pekerjaan utama ke pihak lain</td><td><span class=\"tag r\">Merah</span></td></tr>\n    <tr><td>5</td><td>Wanprestasi sehingga kontrak <b>diputus sepihak</b></td><td><span class=\"tag r\">Merah</span></td></tr>\n    <tr><td>6</td><td>Terbukti menyebabkan <b>fatality</b>, kebakaran/kerugian lain ≥ USD 1 juta, atau tumpahan &gt; 15 Bbl</td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>7</td><td>Kolusi, korupsi, suap, gratifikasi ke pekerja/pejabat/keluarga (keputusan Komite Sanksi)</td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>8</td><td>Persekongkolan mengatur harga dengan peserta lain (keputusan Komite Sanksi)</td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>9</td><td>Membuat/memalsukan/memanipulasi data, dokumen, surat keterangan (keputusan Komite Sanksi)</td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>10</td><td>Pengurus/pemilik modal diputus bersalah (inkracht) terkait penyedia/pekerjaan yang merugikan Pertamina</td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>11</td><td>Dinyatakan <b>pailit</b> (tingkat pertama maupun kasasi)</td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>12</td><td>Memasok barang/pekerjaan <b>fiktif</b></td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n    <tr><td>13</td><td>Memasok barang <b>palsu/rekondisi</b></td><td><span class=\"tag\" style=\"background:#111\">Hitam</span></td></tr>\n  </table>"}, {"book": "pen", "sec": "04 · Dampak Sanksi", "ref": "Bab III.B.12–15", "kick": "Kalau penyedia kena sanksi", "title": "Dampak Merah & Hitam", "c": "--c:var(--red)", "html": "<table>\n    <tr><th style=\"width:68px\">Kondisi</th><th><span class=\"tag r\">Merah</span></th><th><span class=\"tag\" style=\"background:#111\">Hitam</span></th></tr>\n    <tr><td><b>Kontrak sudah ditandatangani / pekerjaan berjalan</b></td><td>Pekerjaan <b>harus</b> diselesaikan pelaksana kontrak</td><td>Dilanjutkan sampai selesai <b>atau</b> diputus, atas pertimbangan <b>FPP</b> &amp; persetujuan Pejabat Berwenang FPP</td></tr>\n    <tr><td><b>Pemilihan sedang berjalan</b></td><td>Dibatalkan keikutsertaannya, selama <b>belum lulus</b> kualifikasi umum &amp; khusus</td><td>Dibatalkan keikutsertaannya, selama <b>SP3MK/kontrak belum ditandatangani</b></td></tr>\n    <tr><td><b>Pelanggaran lagi</b></td><td>Kena Merah lagi → jadi <b>Hitam</b></td><td>Fraud di masa percobaan → SKT dicabut selamanya</td></tr>\n  </table>\n  <h2>Berlaku sejak kapan</h2>\n  <p>Sejak tanggal <b>Surat Pemberitahuan Pengenaan Sanksi</b> dan input sanksi di PVD. <b>Tidak berlaku surut</b>.</p>\n  <h2>Cabang &amp; induk (Merah/Hitam bukan karena akumulasi poin)</h2>\n  <ul class=\"d\" style=\"--c:var(--red)\">\n    <li>Sanksi ke <b>kantor pusat</b> → berlaku juga untuk semua cabang/perwakilan.</li>\n    <li>Sanksi ke <b>cabang</b> → berlaku juga untuk cabang lain dan kantor pusat.</li>\n    <li>Daftar Hitam perusahaan induk <b>tidak</b> berlaku untuk anak perusahaannya, dan sebaliknya.</li>\n  </ul>"}, {"book": "pen", "sec": "05 · Komite Sanksi", "ref": "Bab III.B.5", "kick": "Kasus khusus", "title": "Komite Sanksi", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Dibentuk <b>sesuai kebutuhan</b> (ad-hoc), minimal: <b>Procurement, Hukum, FPP</b>; HSSE/Keuangan bila perlu.</li>\n    <li>Tidak perlu Surat Perintah; bila perlu bisa lewat SP yang disahkan Direksi.</li>\n  </ul>\n  <table>\n    <tr><th>Tahap</th><th>Ketua Komite Sanksi</th></tr>\n    <tr><td>Registrasi / Update Data</td><td>Pejabat Procurement yang bertanggung jawab langsung atas registrasi</td></tr>\n    <tr><td>Pemilihan penyedia</td><td>Pejabat Procurement yang terlibat langsung dalam pemilihan</td></tr>\n    <tr><td>Pelaksanaan kontrak; atau pelanggaran diketahui setelah kontrak berakhir</td><td>Pejabat Procurement yang bertanggung jawab atas penerbitan kontrak</td></tr>\n  </table>\n  <p class=\"small\">Catatan di bawah tabel TKO: “Pejabat Tertinggi Fungsi Procurement (Pengadaan) adalah Ketua Komite Sanksi.”</p>\n  <h2>Siapa bisa meminta rapat</h2>\n  <p style=\"margin-bottom:.24px\">Procurement mengajukan rapat atas permintaan:</p>\n  <div class=\"grid2\"><ul class=\"d\" style=\"--c:var(--navy)\"><li>Procurement sendiri</li><li><b>FPP</b></li></ul><ul class=\"d\" style=\"--c:var(--navy)\"><li>Fungsi terkait (HSSE, Hukum, Keuangan)</li><li>Komite Sanksi lain (eskalasi)</li></ul></div>\n  <div class=\"box s\"><b>Contoh kasus Komite Sanksi</b> (Pedoman III.G): pelanggaran tidak ada di Tabel Penilaian Kinerja, indikasi fraud, pelanggaran di luar Pertamina Grup yang memengaruhi kredibilitas, atau pelanggaran yang diketahui setelah kontrak selesai.</div>"}, {"book": "pen", "sec": "05 · Komite Sanksi", "ref": "Bab III.B.5, VII.B · Lamp. 5", "kick": "Keputusan & alur", "title": "Rapat Komite Sanksi", "c": "--c:var(--navy)", "html": "<p style=\"margin-bottom:.24px\"><b>Keputusan bisa berupa:</b> golongan Merah/Hitam · poin sanksi · pembekuan SKT sementara · penghapusan dari DPT &amp; pencabutan SKT · izin mengikutsertakan <i>sole source</i> yang terkena sanksi · keputusan lain.</p>\n  <ul class=\"d\" style=\"--c:var(--navy)\">\n    <li><b>Tidak dapat dianulir</b> oleh Procurement, FPP, fungsi terkait, maupun Komite yang meminta eskalasi.</li>\n    <li>Komite di level lebih tinggi boleh meminta penjelasan atas keputusan level lebih rendah.</li>\n    <li>Risalah rapat bersifat <b>rahasia</b>: hanya untuk anggota Komite &amp; Procurement peminta.</li>\n  </ul>\n  <div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">1</div><div class=\"t\"><b>Minta rapat + dokumen <span class=\"who\">Procurement</span></b><span>Seluruh dokumen pendukung yang valid.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--navy)\">2</div><div class=\"t\"><b>Rapat &amp; telaah <span class=\"who\">Komite Sanksi</span></b><span>Bisa minta penjelasan semua pihak terkait.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--navy)\">3</div><div class=\"t\"><b>Keputusan dalam risalah <span class=\"who\">Komite Sanksi</span></b><span>Waktu/tempat, resume, jenis sanksi, pelaksana tindak lanjut; dikirim ke Procurement/pihak yang ditetapkan.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">4</div><div class=\"t\"><b>Terima risalah &amp; tindak lanjuti <span class=\"who\">Procurement</span></b><span>Atau pihak lain yang ditetapkan risalah.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">5</div><div class=\"t\"><b>Input sanksi di sistem <span class=\"who\">Procurement</span></b><span>Sesuai hasil risalah (bila perlu).</span></div></div>\n  </div>"}, {"book": "pen", "sec": "06 · Koreksi Sanksi", "ref": "Bab III.B.7 · Lamp. 4", "kick": "Meninjau ulang sanksi", "title": "Ketentuan koreksi sanksi", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Diajukan penyedia bila ada <b>bukti baru</b> yang diduga kuat bisa menganulir sanksi, dengan dokumen yang valid.</li>\n    <li>Pada prinsipnya hanya bisa dikoreksi oleh <b>pihak yang memberi sanksi</b>. Sanksi dari Komite → diajukan rapat Komite ulang.</li>\n  </ul>\n  <div class=\"grid2\">\n    <div class=\"box r\" style=\"margin:0\"><b>Hitam karena fatality</b><br>Boleh mengajukan setelah menjalani sanksi min. <b>6 bulan</b> (tidak berlaku bagi anak/afiliasi Pertamina) dan <b>dinilai CSMS ulang</b>.</div>\n    <div class=\"box o\" style=\"margin:0\"><b>Hitam selain fatality</b><br>Jalani <b>seluruh masa sanksi</b>, tanpa koreksi, kecuali ada bukti baru yang menganulir.</div>\n  </div>\n  <h2>Bentuk koreksi oleh Komite Sanksi</h2>\n  <table>\n    <tr><th>Sanksi semula</th><th>Bentuk koreksi</th></tr>\n    <tr><td>Golongan Merah/Hitam</td><td>Kembali ke golongan semula; Hitam → Merah/Kuning; atau Merah → Kuning</td></tr>\n    <tr><td>Poin sanksi</td><td>Poin dipulihkan seperti sebelum sanksi; atau poin dikoreksi</td></tr>\n    <tr><td>Pembekuan SKT</td><td>SKT diaktifkan; periode pembekuan dikurangi; atau aktif kembali dengan poin sanksi</td></tr>\n    <tr><td>Penghapusan DPT &amp; pencabutan SKT</td><td>SKT diaktifkan kembali; atau aktif kembali dengan poin sanksi</td></tr>\n  </table>"}, {"book": "pen", "sec": "06 · Koreksi Sanksi", "ref": "Bab VII.C–D · Lamp. 6", "kick": "Langkah demi langkah", "title": "Alur koreksi sanksi", "c": "--c:var(--navy)", "html": "<p class=\"lead\">Oleh Tim Registrasi / Procurement / <b>FPP</b> yang menjatuhkan sanksi.</p>\n  <div class=\"flow tight\">\n    <div class=\"st\"><div class=\"dot\" style=\"background:#e3a008\">1</div><div class=\"t\"><b>Ajukan permohonan <span class=\"who\">Penyedia</span></b><span>Beserta dokumen pendukung yang valid, ke pihak yang menjatuhkan sanksi.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">2</div><div class=\"t\"><b>Telaah &amp; klarifikasi <span class=\"who\">Pemberi sanksi</span></b><span>Bisa melibatkan Keuangan, HSSE, Hukum.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--navy)\">3</div><div class=\"t\"><b>Putuskan dalam risalah <span class=\"who\">Pemberi sanksi</span></b><span>Setuju, tolak, atau keputusan lain.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--blue)\">4</div><div class=\"t\"><b>Beri tahu penyedia <span class=\"who\">Pemberi sanksi</span></b><span>Surat pemberitahuan keputusan.</span></div></div>\n    <div class=\"st\"><div class=\"dot\" style=\"background:var(--green)\">5</div><div class=\"t\"><b>Sesuaikan kinerja di PVD <span class=\"who\">Pemberi sanksi</span></b><span>Bila diperlukan.</span></div></div>\n  </div>\n  <div class=\"box s\"><b>Koreksi oleh Komite Sanksi</b> sama alurnya, tetapi: rapat hanya atas permintaan <b>Procurement</b>, dan tindak lanjut risalah dilakukan oleh Procurement peminta (atau pihak yang ditetapkan), bukan oleh Komite.</div>"}, {"book": "pen", "sec": "06 · Pemberitahuan", "ref": "Bab III.B.9–11, V", "kick": "Komunikasi ke penyedia", "title": "Pemberitahuan & keberatan", "c": "--c:var(--navy)", "html": "<ul class=\"d\" style=\"--c:var(--navy)\">\n    <li>Poin kinerja (+/−) bisa dilihat penyedia sendiri di sistem aplikasi Pertamina.</li>\n    <li><b>Procurement/FPP</b> sesuai kewenangan wajib mengirim <b>Surat Pemberitahuan</b> bila: sanksi Merah (bukan akumulasi poin), sanksi Hitam, atau keputusan koreksi sanksi.</li>\n    <li>Sanksi dari Komite: disampaikan Procurement peminta, <b>FPP</b>, atau pihak yang ditetapkan Komite.</li>\n  </ul>\n  <div class=\"box r\" style=\"display:flex;gap:9.6px;align-items:center\"><span class=\"big\">5 HK</span><span>Batas penyedia mengirim <b>Surat Keberatan</b> + bukti, sejak Surat Pemberitahuan Pengenaan Sanksi diterima.</span></div>\n  <h2>Fatality di anak/afiliasi Pertamina</h2>\n  <p>Belum disanksi → Fungsi HSSE memberi info ke Procurement dengan bukti; Procurement dapat meminta penjelasan dan mengingatkan pihak terkait untuk segera menindaklanjuti.</p>\n  <h2>Checklist dokumen</h2>\n  <div class=\"grid2\">\n    <ul class=\"d\" style=\"--c:var(--navy)\"><li>Dokumen registrasi, pemilihan, pengawasan kontrak</li><li>Memo pemberitahuan pelanggaran</li><li>Risalah klarifikasi</li><li>Surat pemberitahuan sanksi</li></ul>\n    <ul class=\"d\" style=\"--c:var(--navy)\"><li>Surat permintaan koreksi + bukti</li><li>Surat keberatan</li><li>Memo permintaan &amp; risalah Komite Sanksi</li><li>Surat keputusan koreksi sanksi</li></ul>\n  </div>"}]};</script>
<script>
'use strict';
const C = window.CONTENT || {pedoman:[],tko:[],flow:''};
let deferred = null;
const $ = s => document.querySelector(s);
const app = $('#app');
const BOOKS = {
  pedoman:{name:'Pedoman Pengadaan',doc:'Pedoman No. A-002/B24000/2023-S9 · Rev. 1',items:C.pedoman},
  tko:{name:'TKO Pemilihan Penyedia',doc:'TKO No. B-008/B24000/2023-S9 · Rev. 0',items:C.tko,short:'TKO Pemilihan',col:'var(--green)'},
  reg:{name:'TKO Registrasi Penyedia',doc:'TKO No. B-004/B24000/2023-S9 · Rev. 0',items:C.reg||[],short:'TKO Registrasi',col:'var(--blue)'},
  pen:{name:'TKO Penilaian Kinerja',doc:'TKO No. B-003/B24000/2023-S9 · Rev. 0',items:C.pen||[],short:'TKO Penilaian',col:'var(--red)'}
};
BOOKS.pedoman.short='Pedoman'; BOOKS.pedoman.col='var(--blue)';
const TKO_KEYS = ['tko','reg','pen'];
const fmt = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const num = v => { const d = String(v||'').replace(/[^\d]/g,''); return d ? parseInt(d,10) : 0; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('Data tidak bisa disimpan di perangkat ini'); return false; } }
};
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
function wrapTables(el){ el.querySelectorAll('table').forEach(t=>{ if(t.parentElement.classList.contains('tw')) return; const w=document.createElement('div'); w.className='tw'; t.replaceWith(w); w.appendChild(t); }); }
function setTitle(t, back){ $('#ttl').textContent=t; $('#back').classList.toggle('on', !!back); }
$('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#home');
function textOf(html){ const d=document.createElement('div'); d.innerHTML=html.replace(/<(?!\/?(b|strong|i|em|span|u|mark)\b)/g,' <'); return d.textContent.replace(/\s+/g,' ').trim(); }
Object.values(BOOKS).forEach(b => b.items.forEach(it => it.text = textOf(it.html)));
